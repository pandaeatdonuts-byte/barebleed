<!doctype html>
<html lang="en">

<head>
  <meta name="twitter:card" content="summary">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050405">
  <meta name="description" content="Hi">
  <title>barebleed</title>
  <link rel="icon" type="image/png" href="cursor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #050405;
      --accent: #dc1226;
      --frost: #e9eef5;
      --pointer-x: 50vw;
      --pointer-y: 50vh;
    }

    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      pointer-events: none;
      opacity: 0;
      background: url("cursor.png") center / contain no-repeat;
      will-change: transform;
      transition: opacity .2s ease;
    }

    .custom-cursor.is-visible {
      opacity: 1;
    }

    @media (pointer: coarse) {

      *,
      *::before,
      *::after {
        cursor: auto !important;
      }

      .custom-cursor {
        display: none;
      }
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      color: var(--frost);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    @keyframes grainShift {
      0% {
        transform: translate3d(-1.5%, -1%, 0);
      }

      100% {
        transform: translate3d(1.5%, 1%, 0);
      }
    }

    @keyframes snowFall {
      from {
        transform: translate3d(0, -4vh, 0);
      }

      to {
        transform: translate3d(var(--drift), 108vh, 0);
      }
    }

    @keyframes cdDrop {
      from {
        opacity: 0;
        scale: .82;
        filter: blur(8px);
      }

      to {
        opacity: 1;
        scale: 1;
        filter: blur(0);
      }
    }

    @keyframes cleanReveal {
      from {
        opacity: 0;
        translate: 0 15px;
        filter: blur(5px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes cleanRevealLeft {
      from {
        opacity: 0;
        translate: -12px 0;
        filter: blur(4px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes cleanRevealDown {
      from {
        opacity: 0;
        translate: 0 -15px;
        filter: blur(5px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes lineReveal {
      from {
        opacity: 0;
        translate: 0 6px;
        filter: blur(4px);
        clip-path: inset(0 100% 0 0);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes entryExit {
      from {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }

      to {
        opacity: 0;
        translate: 0 -12px;
        filter: blur(8px);
      }
    }

    @keyframes entryBreath {

      0%,
      100% {
        opacity: .82;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.03);
      }
    }

    .scene {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      background: #030303;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .07;
      background:
        repeating-radial-gradient(circle at 31% 37%, transparent 0 1px, rgba(255, 255, 255, .08) 1px 2px, transparent 2px 4px),
        repeating-linear-gradient(121deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 5px);
      background-size: 19px 21px, 13px 17px;
      mix-blend-mode: screen;
      animation: grainShift 9s steps(8) infinite alternate;
    }

    .bg-canvas {
      position: fixed;
      inset: -34px;
      z-index: -3;
      width: calc(100% + 68px);
      height: calc(100% + 68px);
      pointer-events: none;
      filter: blur(80px) brightness(.34) saturate(.75);
      transition: filter 1.35s cubic-bezier(.16, 1, .3, 1);
    }

    .entered .bg-canvas {
      filter: blur(80px) brightness(.66) saturate(1.02);
    }

    .scene::before {
      content: "";
      position: fixed;
      inset: -18px;
      z-index: -2;
      background:
        radial-gradient(115% 95% at 68% 30%, rgba(0, 0, 0, 0), rgba(1, 2, 4, .34) 72%, rgba(0, 1, 3, .55) 100%),
        linear-gradient(rgba(1, 2, 4, .2), rgba(0, 1, 3, .42));
      transition: filter 1.35s cubic-bezier(.16, 1, .3, 1), transform 1.5s cubic-bezier(.16, 1, .3, 1);
    }

    .entered.scene::before {
      background:
        radial-gradient(115% 95% at 68% 30%, rgba(0, 0, 0, 0), rgba(1, 2, 4, .22) 70%, rgba(0, 1, 3, .5) 100%),
        linear-gradient(rgba(1, 2, 4, .12), rgba(0, 1, 3, .32));
    }

    .pointer-glow {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(340px circle at var(--pointer-x) var(--pointer-y), rgba(196, 18, 38, .12), transparent 70%);
    }

    .snowfall {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      opacity: .72;
    }

    .snowflake {
      position: absolute;
      top: -4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 0 6px rgba(255, 255, 255, .18);
      animation: snowFall linear infinite;
      will-change: transform;
    }

    /* Music control block, bottom-left. */
    .music-player {
      position: fixed;
      top: auto;
      right: auto;
      bottom: 24px;
      left: 26px;
      z-index: 9;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 130px);
      grid-template-areas:
        "meta controls eq"
        "progress progress progress"
        "status status status";
      align-items: center;
      gap: 6px 18px;
      width: clamp(330px, 33vw, 460px);
      padding: 12px 14px 8px;
      transform: translateY(16px);
      opacity: 0;
      transition: opacity .8s ease .3s, transform .9s cubic-bezier(.16, 1, .3, 1) .3s;
    }

    .entered .music-player {
      transform: translateY(0);
      opacity: 1;
    }

    .music-player>* {
      position: relative;
      z-index: 1;
    }

    .track-line {
      grid-area: meta;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
      min-width: 0;
    }

    .track-title {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      color: rgba(255, 255, 255, .97);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: lowercase;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .85), 0 0 30px rgba(0, 0, 0, .5);
      transition: opacity .3s ease;
    }

    .track-subtitle {
      width: 100%;
      overflow: hidden;
      color: rgba(255, 255, 255, .5);
      font: italic 400 11.5px/1.3 Georgia, "Times New Roman", serif;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .8), 0 0 24px rgba(0, 0, 0, .4);
      transition: opacity .3s ease;
    }

    .player-controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .player-control {
      display: grid;
      width: 28px;
      height: 28px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(255, 255, 255, .72);
      background: transparent;
      transition: transform .25s cubic-bezier(.16, 1, .3, 1), color .2s ease, background .2s ease;
    }

    .player-control:hover {
      color: #fff;
      background: rgba(255, 255, 255, .1);
      transform: scale(1.08);
    }

    .player-control.primary {
      width: 32px;
      height: 32px;
      color: #0c0d10;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    }

    .player-control.primary:hover {
      transform: scale(1.06);
      background: #fff;
      color: #0c0d10;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .42);
    }

    .player-icon {
      display: block;
      width: 15px;
      height: 15px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .player-control.primary .player-icon {
      width: 12px;
      height: 12px;
      stroke-width: 2;
    }

    .icon-pause {
      display: none;
    }

    .is-playing .icon-play {
      display: none;
    }

    .is-playing .icon-pause {
      display: block;
    }

    .player-control:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 2px;
    }

    .progress {
      grid-area: progress;
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 14px;
      margin: 2px 0 -6px;
      padding: 0;
      appearance: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      outline: none;
      cursor: pointer;
      pointer-events: auto;
    }

    .progress::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff var(--played, 0%), rgba(255, 255, 255, .3) var(--played, 0%));
    }

    .progress::-webkit-slider-thumb {
      width: 7px;
      height: 7px;
      margin-top: -2.5px;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }

    .progress:hover::-webkit-slider-thumb,
    .progress:focus-visible::-webkit-slider-thumb,
    .progress:active::-webkit-slider-thumb {
      opacity: .9;
    }

    .progress::-moz-range-track {
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .3);
    }

    .progress::-moz-range-progress {
      height: 2px;
      border-radius: 999px;
      background: #fff;
    }

    .progress::-moz-range-thumb {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: .9;
      transition: opacity .18s ease;
    }

    .track-status {
      grid-area: status;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      color: rgba(255, 255, 255, .5);
      font: 10px/1 monospace;
      letter-spacing: .06em;
    }

    .track-status .remaining {
      justify-self: end;
    }

    .track-line,
    .player-controls,
    .progress,
    .track-status {
      transition: opacity .3s ease;
    }

    .music-player .track-line,
    .music-player .player-controls,
    .music-player .progress,
    .music-player .track-status {
      opacity: 0;
    }

    .entered .music-player .track-line {
      animation: cleanRevealLeft .65s .5s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .player-controls {
      animation: cleanReveal .62s .56s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .progress {
      animation: cleanRevealLeft .7s .62s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .track-status {
      animation: cleanReveal .55s .7s cubic-bezier(.16, 1, .3, 1) both;
    }

    .music-player.is-switching .track-title,
    .music-player.is-switching .track-subtitle {
      opacity: 0;
    }

    .scene.is-switching .cd-disc {
      opacity: .18;
    }

    /* Spinning CD on the left, artwork from the current track. */
    .cd-wrap {
      position: fixed;
      left: 4.5vw;
      top: 50%;
      z-index: 6;
      width: clamp(300px, 36vw, 540px);
      aspect-ratio: 1;
      transform: translate3d(-26px, calc(-50% + 18px), 0);
      opacity: 0;
      scale: 1;
      pointer-events: auto;
      transition: opacity .9s ease .45s, transform 1s cubic-bezier(.16, 1, .3, 1) .45s, scale .5s cubic-bezier(.16, 1, .3, 1);
    }

    .playing .cd-wrap:hover {
      scale: 1.05;
    }

    .cd-wrap:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 8px;
    }

    .entered .cd-wrap {
      transform: translate3d(0, -50%, 0);
      opacity: 1;
      animation: cdDrop .9s .5s cubic-bezier(.16, 1, .3, 1) both;
    }

    .cd-disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #0c0d11;
      box-shadow: 0 46px 90px rgba(0, 0, 0, .5), 0 14px 34px rgba(0, 0, 0, .4);
      will-change: transform;
      transition: opacity .26s ease;
    }

    .cd-artwork {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      filter: contrast(1.06) saturate(1.12) brightness(.68);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .16),
        inset 0 0 46px rgba(0, 0, 0, .52);
    }

    .cd-tone {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .03) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 50% 50%, transparent 0 26%, rgba(0, 0, 0, .18) 54%, rgba(0, 0, 0, .42) 76%, rgba(0, 0, 0, .62) 97%);
    }

    .cd-streak {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .cd-streak.a {
      background: linear-gradient(118deg,
        transparent 26%,
        rgba(255, 255, 255, .16) 40%,
        rgba(122, 224, 255, .2) 44.5%,
        rgba(255, 140, 160, .16) 48%,
        rgba(160, 240, 190, .14) 51%,
        rgba(255, 255, 255, .1) 55%,
        transparent 68%);
      opacity: .9;
    }

    .cd-streak.b {
      background: linear-gradient(118deg,
        transparent 34%,
        rgba(190, 160, 255, .12) 41%,
        rgba(255, 220, 150, .1) 45%,
        transparent 52%);
      opacity: .8;
    }

    .cd-rim {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .22),
        inset 0 -6px 18px rgba(0, 0, 0, .5),
        inset 0 6px 14px rgba(255, 255, 255, .05);
      pointer-events: none;
    }

    .cd-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: 32%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(6, 7, 10, 0) 0 13%,
          #cfd3db 13% 14.5%,
          rgba(36, 39, 46, .62) 14.5% 30%,
          rgba(26, 28, 34, .5) 30% 40%,
          rgba(14, 15, 19, .3) 41% 45%,
          rgba(10, 10, 14, 0) 52%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    }

    /* Profile card, right side, slightly tilted. */
    .profile {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --move-x: 0px;
      --move-y: 0px;
      --shine-x: 50%;
      --shine-y: 35%;
      position: fixed;
      right: 5vw;
      top: 50%;
      z-index: 5;
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      grid-template-areas:
        "avatar head"
        "bio bio"
        "socials socials";
      gap: 14px 28px;
      width: clamp(400px, 50vw, 700px);
      padding: 34px 38px 30px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 26px;
      background: linear-gradient(168deg, rgba(11, 12, 15, .8), rgba(6, 7, 9, .7));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 34px 90px rgba(0, 0, 0, .55);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      transform: translate3d(var(--move-x), calc(-50% + 22px + var(--move-y)), 0) rotate(2.3deg) perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      will-change: transform;
      opacity: 0;
      transition: opacity .95s ease .62s, transform .16s cubic-bezier(.2, .8, .2, 1), border-color .25s ease, box-shadow .25s ease;
    }

    .entered .profile {
      transform: translate3d(var(--move-x), calc(-50% + var(--move-y)), 0) rotate(2.3deg) perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      opacity: 1;
    }

    .profile::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(140deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .04) 34%, rgba(255, 255, 255, .02) 66%, rgba(230, 30, 60, .22) 100%);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .profile::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background: radial-gradient(320px circle at var(--shine-x) var(--shine-y), rgba(255, 255, 255, .09), transparent 72%);
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .entered .profile::after {
      opacity: .6;
      transition: opacity 1s ease .8s;
    }

    .entered .profile:hover::after {
      opacity: .92;
      transition-delay: 0s;
    }

    .profile>* {
      position: relative;
      z-index: 1;
    }

    .avatar-wrap {
      grid-area: avatar;
      align-self: center;
      justify-self: start;
      width: 128px;
      transform: translateZ(18px);
    }

    .avatar-ring {
      position: relative;
      width: 128px;
      height: 128px;
      padding: 3px;
      border-radius: 28px;
      background: linear-gradient(150deg, rgba(244, 92, 112, .8), rgba(122, 8, 28, .95) 52%, rgba(230, 30, 60, .55));
      box-shadow: 0 12px 32px rgba(0, 0, 0, .45), 0 0 26px rgba(160, 18, 38, .2);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 25px;
      object-fit: cover;
      filter: saturate(.95) brightness(.9);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1), filter .35s ease;
    }

    .avatar-wrap:hover .avatar {
      transform: scale(1.04) rotate(-1deg);
      filter: saturate(1) brightness(1);
    }

    .head {
      grid-area: head;
      min-width: 0;
      transform: translateZ(12px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      margin: 0 0 4px;
      color: rgba(255, 255, 255, .55);
      font: 600 10px/1 Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: lowercase;
    }

    .eyebrow i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e0142c;
      box-shadow: 0 0 8px #e0142c;
    }

    .profile h1 {
      margin: 0;
      color: #fff;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(48px, 5.6vw, 68px);
      line-height: 1;
      letter-spacing: -.01em;
      text-align: left;
      text-transform: lowercase;
      text-shadow: 0 4px 24px rgba(0, 0, 0, .55);
    }

    .bio {
      grid-area: bio;
      width: 100%;
      margin: 2px 0 0;
      color: rgba(255, 255, 255, .62);
      font: italic 400 clamp(16px, 1.9vw, 18px)/1.55 Georgia, "Times New Roman", serif;
      text-align: left;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .8);
      transform: translateZ(8px);
    }

    .socials {
      grid-area: socials;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin: 0;
      transform: translateZ(8px);
    }

    .social {
      display: grid;
      width: 40px;
      height: 40px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 0;
      color: rgba(255, 255, 255, .4);
      background: transparent;
      transition: transform .3s cubic-bezier(.16, 1, .3, 1), color .25s ease;
    }

    .social:hover {
      color: #fff;
      transform: translateY(-3px) scale(1.06);
    }

    .social.discord:hover {
      color: #7289da;
    }

    .social.youtube:hover {
      color: #ff0033;
    }

    .social:focus-visible {
      outline: 2px solid #dc1226;
      outline-offset: 3px;
    }

    .social svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    a.social {
      text-decoration: none;
      appearance: none;
    }

    .profile .avatar-wrap,
    .profile .head,
    .profile .bio,
    .profile .socials,
    .profile .social {
      opacity: 0;
    }

    .entered .profile .avatar-wrap {
      animation: cleanReveal .78s .72s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .head {
      animation: cleanRevealLeft .74s .8s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .bio {
      animation: cleanRevealLeft .68s .88s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .socials {

    }

    .entered .profile .social {
      animation: socialPop .55s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes socialPop {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.72) rotate(-5deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    /* Volume dock, top-left. */
    .volume-dock {
      position: fixed;
      top: 20px;
      left: 22px;
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 8px 8px;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      background: linear-gradient(170deg, rgba(10, 11, 14, .78), rgba(6, 7, 9, .72));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 14px 40px rgba(0, 0, 0, .45);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      opacity: 0;
      transition: opacity .8s ease .42s;
    }

    .entered .volume-dock {
      opacity: 1;
      animation: cleanReveal .65s .44s cubic-bezier(.16, 1, .3, 1) both;
    }

    .sound-toggle {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(255, 255, 255, .9);
      background: transparent;
      transition: background .2s ease, transform .25s cubic-bezier(.16, 1, .3, 1);
    }

    .sound-toggle:hover {
      background: rgba(255, 255, 255, .12);
      transform: scale(1.07);
    }

    .sound-toggle:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 2px;
    }

    .sound-toggle svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sound-toggle.is-muted .sound-wave {
      opacity: .18;
    }

    /* Equalizer, right wing of the player. */
    .eq {
      grid-area: eq;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 5px;
      height: 40px;
      justify-self: end;
      align-self: end;
      pointer-events: none;
    }

    .eq span {
      display: block;
      width: 5px;
      height: 100%;
      border-radius: 3px;
      background: rgba(255, 255, 255, .85);
      transform-origin: bottom;
      transform: scaleY(.12);
      will-change: transform;
    }

    .volume-slider {
      display: block;
      width: 140px;
      height: 14px;
      margin: 0;
      padding: 0;
      appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff var(--filled, 80%), rgba(255, 255, 255, .24) var(--filled, 80%));
    }

    .volume-slider::-webkit-slider-thumb {
      width: 7px;
      height: 7px;
      margin-top: -2.5px;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .volume-slider:hover::-webkit-slider-thumb,
    .volume-slider:focus-visible::-webkit-slider-thumb,
    .volume-slider:active::-webkit-slider-thumb {

    }

    .volume-slider::-moz-range-track {

      border-radius: 999px;
      background: rgba(255, 255, 255, .24);
    }

    .volume-slider::-moz-range-progress {
      height: 2px;
      border-radius: 999px;
      background: #fff;
    }

    .volume-slider::-moz-range-thumb {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: .9;
    }

    /* Entry gate. */
    .entry {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      border: 0;
      color: #fff;
      overflow: hidden;
      isolation: isolate;
      background: rgba(2, 3, 5, .52);
      cursor: pointer;
      transition: opacity .7s ease, visibility .7s;
    }

    .entry::after {

      position: absolute;

    }

    }

    .entered .entry {

    }

    .entry-copy {

      letter-spacing: .08em;
      text-transform: lowercase;
      text-shadow: 0 3px 25px rgba(0, 0, 0, .7);
      animation: entryBreath 2.6s ease-in-out infinite;
    }

    @media (max-width: 860px) {

      .scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 14px 120px;
        overflow: hidden;
        overscroll-behavior: none;

        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:

      }

      .music-player .eq {

      }

      .cd-wrap {
        position: static;
        order: 1;
        width: 56vw;

      .profile {
        position: static;

        gap: 12px 18px;
        padding: 24px 22px;

      .entered .profile {

      .avatar-wrap {

      .avatar-ring {

      .bg-canvas {

        top: 12px;
        left: 12px;
        padding: 6px 10px 6px 6px;
      }

      .volume-slider {
        width: 92px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .snowfall,
      .grain {
        display: none;
      }
    }
  </style>
</head>

  <script>
    const scene = document.getElementById("scene");
    const entry = document.getElementById("entry");
    const profile = document.querySelector(".profile");
    const audio = document.getElementById("audio");
    const playToggle = document.getElementById("play-toggle");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("current-time");
    const duration = document.getElementById("duration");
    const skipBack = document.getElementById("skip-back");
    const skipForward = document.getElementById("skip-forward");
    const musicPlayer = document.querySelector(".music-player");
    const cdArtwork = document.querySelector(".cd-artwork");
    const trackTitle = document.querySelector(".track-title");
    const trackSubtitle = document.querySelector(".track-subtitle");
    const soundToggle = document.getElementById("sound-toggle");
    const volumeSlider = document.getElementById("volume");
    const customCursor = document.getElementById("custom-cursor");

    /* Ambient background: blurred blobs coloured from the current cover. */
    const bgCanvas = document.querySelector(".bg-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    const bgBlobs = [];
    const blobCount = 6;
    let bgTargets = [
      [34, 38, 46],
      [30, 32, 40],
      [42, 30, 34],
      [34, 34, 34],
      [30, 30, 40],
      [40, 36, 30],
    ];
    let bgAccum = 0;

    for (let index = 0; index < blobCount; index += 1) {
      bgBlobs.push({
        u: 0.2 + Math.random() * 0.6,
        v: 0.18 + Math.random() * 0.64,
        r: 0.5 + Math.random() * 0.42,
        orbit: 0.05 + Math.random() * 0.13,
        speed: (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.11),
        ratio: 0.7 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.5 + Math.random() * 0.34,
        color: [26, 28, 34],
      });
    }

    function paletteFromImage(image) {
      const grid = 44;
      const sampler = document.createElement("canvas");
      sampler.width = grid;
      sampler.height = grid;
      const samplerCtx = sampler.getContext("2d", { willReadFrequently: true });
      samplerCtx.drawImage(image, 0, 0, grid, grid);
      const data = samplerCtx.getImageData(0, 0, grid, grid).data;
      const buckets = new Map();

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const level = (Math.max(r, g, b) + Math.min(r, g, b)) / 510;
        if (level < 0.07 || level > 0.95) continue;
        const spread = Math.max(r, g, b) - Math.min(r, g, b);
        if (spread < 31 && Math.max(r, g, b) < 88) continue;

        const key = (r >> 5 << 6) | (g >> 5 << 3) | (b >> 5);
        const bucket = buckets.get(key) || { r: 0, g: 0, b: 0, w: 0 };
        bucket.r += r;
        bucket.g += g;
        bucket.b += b;
        bucket.w += 1 + spread / 38 + (1 - Math.abs(level - 0.45)) * 0.9;
        buckets.set(key, bucket);
      }

      const ranked = [...buckets.values()]
        .map(bucket => ({
          r: bucket.r / bucket.w,
          g: bucket.g / bucket.w,
          b: bucket.b / bucket.w,
          w: bucket.w,
        }))
        .sort((a, b) => b.w - a.w)
        .slice(0, 14);

      if (!ranked.length) return null;

      const picked = [ranked[0]];
      while (picked.length < 5 && picked.length < ranked.length) {
        let best = null;
        let bestScore = -1;
        for (const candidate of ranked) {
          if (picked.includes(candidate)) continue;
          let distance = Infinity;
          for (const color of picked) {
            distance = Math.min(distance,
              Math.abs(candidate.r - color.r) + Math.abs(candidate.g - color.g) + Math.abs(candidate.b - color.b));
          }
          const score = candidate.w * (0.25 + distance / 255);
          if (score > bestScore) {
            bestScore = score;
            best = candidate;
          }
        }
        if (!best) break;
        picked.push(best);
      }

      while (picked.length < blobCount) {
        const base = picked[picked.length - 1];
        picked.push({ r: base.r * 0.72, g: base.g * 0.72, b: base.b * 0.72 });
      }

      return picked.map(color => [color.r, color.g, color.b]);
    }

    function scanCover(src) {
      const image = new Image();
      image.onload = () => {
        const palette = paletteFromImage(image);
        if (palette) bgTargets = palette;
      };
      image.src = src;
    }

    function paintAmbient() {
      const width = bgCanvas.width;
      const height = bgCanvas.height;
      const time = performance.now() / 1000;

      bgCtx.globalCompositeOperation = "source-over";
      bgCtx.fillStyle = "#040405";
      bgCtx.fillRect(0, 0, width, height);
      bgCtx.globalCompositeOperation = "lighter";

      for (let index = 0; index < bgBlobs.length; index += 1) {
        const blob = bgBlobs[index];
        const angle = blob.phase + time * blob.speed;
        const x = (blob.u + Math.cos(angle) * blob.orbit) * width;
        const y = (blob.v + Math.sin(angle * blob.ratio + blob.phase) * blob.orbit) * height;
        const target = bgTargets[index % bgTargets.length];
        const color = blob.color;

        for (let channel = 0; channel < 3; channel += 1) {
          color[channel] += (target[channel] - color[channel]) * 0.015;
        }

        const glow = bgCtx.createRadialGradient(x, y, 0, x, y, blob.r * Math.min(width, height));
        const rgb = `${Math.round(color[0])}, ${Math.round(color[1])}, ${Math.round(color[2])}`;
        glow.addColorStop(0, `rgba(${rgb}, ${blob.alpha})`);
        glow.addColorStop(0.55, `rgba(${rgb}, ${(blob.alpha * 0.32).toFixed(3)})`);
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        bgCtx.fillStyle = glow;
        bgCtx.fillRect(0, 0, width, height);
      }
    }

    function tickAmbient(dt) {
      bgAccum += dt;
      if (bgAccum < 0.04) return;
      bgAccum = 0;
      paintAmbient();
    }

    function resizeBg() {
      const width = 320;
      bgCanvas.width = width;
      bgCanvas.height = Math.max(120, Math.round((width * window.innerHeight) / window.innerWidth));
      paintAmbient();
    }

    resizeBg();
    window.addEventListener("resize", resizeBg);

    const snowfall = document.getElementById("snowfall");
    const flakeCount = 28;

    for (let index = 0; index < flakeCount; index += 1) {
      const flake = document.createElement("span");
      const size = 1.2 + Math.random() * 1.8;
      flake.className = "snowflake";
      flake.style.left = `${Math.random() * 100}%`;
      flake.style.width = `${size}px`;
      flake.style.height = `${size}px`;
      flake.style.opacity = `${0.22 + Math.random() * 0.32}`;
      flake.style.setProperty("--drift", `${-8 + Math.random() * 16}px`);
      flake.style.animationDuration = `${14 + Math.random() * 16}s`;
      flake.style.animationDelay = `-${Math.random() * 18}s`;
      snowfall.appendChild(flake);
    }

    const eq = document.getElementById("eq");
    const barCount = 12;
    const eqBars = [];
    const eqLevels = new Float32Array(barCount);

    for (let index = 0; index < barCount; index += 1) {
      const bar = document.createElement("span");
      eq.appendChild(bar);
      eqBars.push(bar);
    }

    let audioCtx = null;
    let analyser = null;
    let spectrum = null;

    function ensureAnalyser() {
      if (audioCtx || (typeof window.AudioContext === "undefined" && typeof window.webkitAudioContext === "undefined")) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.55;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      spectrum = new Uint8Array(analyser.frequencyBinCount);
    }

    function tickEq() {
      if (!analyser) return;
      analyser.getByteFrequencyData(spectrum);

      const usable = Math.floor(spectrum.length * 0.82);
      for (let index = 0; index < barCount; index += 1) {
        const t0 = Math.pow(index / barCount, 1.55) * usable;
        const t1 = Math.pow((index + 1) / barCount, 1.55) * usable;
        const start = Math.floor(t0);
        const end = Math.max(start + 1, Math.floor(t1));

        let sum = 0;
        for (let bin = start; bin < end; bin += 1) sum += spectrum[bin];
        const raw = sum / (end - start) / 255;

        // highs are naturally quiet in music; lift the upper bars
        const lift = 1 + Math.pow(index / barCount, 2) * 1.1;
        const target = Math.min(1, Math.pow(raw, 1.42) * lift);

        const level = eqLevels[index];
        eqLevels[index] = target > level
          ? level + (target - level) * 0.38
          : level + (target - level) * 0.12;

        const scaleY = 0.12 + eqLevels[index] * 0.88;
        eqBars[index].style.transform = `scaleY(${scaleY.toFixed(3)})`;
      }
    }

    const cdDisc = document.querySelector(".cd-disc");
    const cdWrap = document.querySelector(".cd-wrap");
    const CD_FULL_SPEED = 24;
    let cdAngle = 0;
    let cdVelocity = 0;
    let cdTarget = 0;
    let lastFrame = performance.now();

    function togglePlayback() {
      if (audio.paused) {
        ensureAnalyser();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => { });
        audio.play().catch(() => { });
      } else {
        audio.pause();
      }
    }

    cdWrap.addEventListener("click", togglePlayback);
    cdWrap.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        togglePlayback();
      }
    });

    function tickCd(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      const rate = cdTarget > cdVelocity ? 2.8 : 1.2;
      cdVelocity += (cdTarget - cdVelocity) * (1 - Math.exp(-dt * rate));
      if (cdTarget === 0 && cdVelocity < 0.02) cdVelocity = 0;

      if (cdVelocity > 0) {
        cdAngle = (cdAngle + cdVelocity * dt) % 360;
        cdDisc.style.transform = `rotate(${cdAngle}deg)`;
      }

      tickEq();
      tickAmbient(dt);

      requestAnimationFrame(tickCd);
    }

    requestAnimationFrame(tickCd);

    const cursorPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const cursorTarget = { x: cursorPos.x, y: cursorPos.y };
    const cursorEase = 0.14;
    const cursorScale = { current: 1, target: 1 };
    const cursorScaleEase = 0.22;

    function renderCursor() {
      cursorPos.x += (cursorTarget.x - cursorPos.x) * cursorEase;
      cursorPos.y += (cursorTarget.y - cursorPos.y) * cursorEase;
      cursorScale.current += (cursorScale.target - cursorScale.current) * cursorScaleEase;
      customCursor.style.transform = `translate(${cursorPos.x}px, ${cursorPos.y}px) scale(${cursorScale.current})`;
      requestAnimationFrame(renderCursor);
    }

    if (window.matchMedia("(pointer: fine)").matches) {
      window.addEventListener("pointermove", event => {
        cursorTarget.x = event.clientX;
        cursorTarget.y = event.clientY;
        customCursor.classList.add("is-visible");
      });
      window.addEventListener("pointerdown", () => {
        cursorScale.target = 0.82;
      });
      window.addEventListener("pointerup", () => {
        cursorScale.target = 1;
      });
      window.addEventListener("pointercancel", () => {
        cursorScale.target = 1;
      });
      document.addEventListener("mouseleave", () => {
        customCursor.classList.remove("is-visible");
        cursorScale.target = 1;
      });
      document.documentElement.addEventListener("mouseenter", () => customCursor.classList.add("is-visible"));
      renderCursor();
    } else {
      document.documentElement.style.setProperty("cursor", "auto");
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "--:--";
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainder}`;
    }

    function syncProgress() {
      const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
      progress.value = Math.round(ratio * 1000);
      progress.style.setProperty("--played", `${ratio * 100}%`);
      currentTime.textContent = formatTime(audio.currentTime);
      duration.textContent = Number.isFinite(audio.duration)
        ? `-${formatTime(Math.max(0, audio.duration - audio.currentTime))}`
        : "--:--";
    }

    const playlist = [
      { title: "fell in luv", artist: "playboi carti ft. bryson tiller", src: "fell-in-luv.mp3", cover: "fell-in-luv-cover.jpg" },
      { title: "yessirskiii", artist: "lil uzi vert & 21 savage", src: "yessirskiii.mp3", cover: "yessirskiii-cover.jpg" },
      { title: "twig", artist: "yen", src: "twig.mp3", cover: "twig-cover.png" },
      { title: "feel my wrath", artist: "yen", src: "feel-my-wrath.mp3", cover: "feel-my-wrath-cover.png" },
      { title: "bastard", artist: "yen", src: "bastard.mp3", cover: "bastard-cover.png" },
      { title: "i keep calling ...", artist: "wifiskeleton, jaydes", src: "i-keep-calling.mp3", cover: "i-keep-calling-cover.png" },
      { title: "i'm a piece of shit", artist: "yen", src: "im-a-piece-of-shit.mp3", cover: "im-a-piece-of-shit-cover.png" },
    ];

    scanCover(playlist[0].cover);

    let trackIndex = 0;
    let isSwitching = false;
    const switchMs = 240;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function updateTrackLabels() {
      const track = playlist[trackIndex];
      musicPlayer.setAttribute("aria-label", `Music player for ${track.title}`);
      playToggle.setAttribute("aria-label", audio.paused ? `Play ${track.title}` : `Pause ${track.title}`);
    }

    function applyTrack(index) {
      trackIndex = (index + playlist.length) % playlist.length;
      const track = playlist[trackIndex];
      audio.src = track.src;
      cdArtwork.src = track.cover;
      scanCover(track.cover);
      trackTitle.textContent = track.title;
      trackSubtitle.textContent = track.artist;
      progress.value = 0;
      progress.style.setProperty("--played", "0%");
      currentTime.textContent = "0:00";
      duration.textContent = "--:--";
      audio.load();
      updateTrackLabels();
    }

    async function loadTrack(index, autoplay = false) {
      const nextIndex = (index + playlist.length) % playlist.length;
      if (isSwitching || nextIndex === trackIndex) return;

      isSwitching = true;
      const wasPlaying = autoplay || !audio.paused;
      musicPlayer.classList.add("is-switching");
      scene.classList.add("is-switching");

      await wait(switchMs / 2);
      if (wasPlaying) audio.pause();
      applyTrack(nextIndex);
      await wait(switchMs / 2);
      musicPlayer.classList.remove("is-switching");
      scene.classList.remove("is-switching");

      if (wasPlaying) audio.play().catch(() => { });
      isSwitching = false;
    }

    function changeTrack(delta) {
      loadTrack(trackIndex + delta, !audio.paused);
    }

    function enterProfile() {
      scene.classList.add("entered");
      entry.setAttribute("aria-hidden", "true");
      entry.tabIndex = -1;
      ensureAnalyser();
      audio.play().catch(() => { });
    }

    entry.addEventListener("click", enterProfile);
    window.addEventListener("keydown", event => {
      if (!scene.classList.contains("entered") && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        enterProfile();
      }
    });

    scene.addEventListener("pointermove", event => {
      document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
      document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
    });

    profile.addEventListener("pointermove", event => {
      const bounds = profile.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      profile.style.setProperty("--tilt-x", `${(0.5 - y) * 5}deg`);
      profile.style.setProperty("--tilt-y", `${(x - 0.5) * 7}deg`);
      profile.style.setProperty("--move-x", `${(x - 0.5) * 10}px`);
      profile.style.setProperty("--move-y", `${(y - 0.5) * 8}px`);
      profile.style.setProperty("--shine-x", `${x * 100}%`);
      profile.style.setProperty("--shine-y", `${y * 100}%`);
    });

    profile.addEventListener("pointerleave", () => {
      profile.style.setProperty("--tilt-x", "0deg");
      profile.style.setProperty("--tilt-y", "0deg");
      profile.style.setProperty("--move-x", "0px");
      profile.style.setProperty("--move-y", "0px");
      profile.style.setProperty("--shine-x", "50%");
      profile.style.setProperty("--shine-y", "35%");
    });

    playToggle.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => { });
      } else {
        audio.pause();
      }
    });

    skipBack.addEventListener("click", () => changeTrack(-1));

    skipForward.addEventListener("click", () => changeTrack(1));

    soundToggle.addEventListener("click", () => {
      audio.muted = !audio.muted;
      soundToggle.classList.toggle("is-muted", audio.muted);
      soundToggle.setAttribute("aria-label", audio.muted ? "Unmute audio" : "Mute audio");
    });

    volumeSlider.addEventListener("input", () => {
      const level = Number(volumeSlider.value) / 100;
      audio.volume = level;
      volumeSlider.style.setProperty("--filled", `${volumeSlider.value}%`);
      if (audio.muted && level > 0) {
        audio.muted = false;
        soundToggle.classList.remove("is-muted");
        soundToggle.setAttribute("aria-label", "Mute audio");
      }
    });

    volumeSlider.style.setProperty("--filled", `${volumeSlider.value}%`);
    audio.volume = Number(volumeSlider.value) / 100;

    progress.addEventListener("input", () => {
      if (!audio.duration) return;
      audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
      syncProgress();
    });

    audio.addEventListener("loadedmetadata", () => {
      syncProgress();
    });

    audio.addEventListener("timeupdate", syncProgress);
    audio.addEventListener("ended", () => loadTrack(trackIndex + 1, true));
    audio.addEventListener("play", () => {
      playToggle.classList.add("is-playing");
      scene.classList.add("playing");
      cdTarget = CD_FULL_SPEED;
      updateTrackLabels();
    });
    audio.addEventListener("pause", () => {
      playToggle.classList.remove("is-playing");
      scene.classList.remove("playing");
      cdTarget = 0;
      updateTrackLabels();
    });

  </script>
</body>
