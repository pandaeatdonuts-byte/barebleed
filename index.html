<!doctype html>
<html lang="en">

<head>
  <meta name="twitter:card" content="summary">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050405">
  <meta name="description" content="Hi">
  <title>barebleed</title>
  <link rel="icon" type="image/png" href="cursor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #050405;
      --accent: #dc1226;
      --frost: #e9eef5;
      --pointer-x: 50vw;
      --pointer-y: 50vh;
    }

    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      pointer-events: none;
      opacity: 0;
      background: url("cursor.png") center / contain no-repeat;
      will-change: transform;
      transition: opacity .2s ease;
    }

    .custom-cursor.is-visible {
      opacity: 1;
    }

    @media (pointer: coarse) {

      *,
      *::before,
      *::after {
        cursor: auto !important;
      }

      .custom-cursor {
        display: none;
      }
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      color: var(--frost);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    @keyframes grainShift {
      0% {
        transform: translate3d(-1.5%, -1%, 0);
      }

      100% {
        transform: translate3d(1.5%, 1%, 0);
      }
    }

    @keyframes elementRise {
      from {
        opacity: 0;
        translate: 0 18px;
        filter: blur(5px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes ringOrbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes statusPulse {

      0%,
      100% {
        box-shadow: 0 0 9px rgba(220, 18, 38, .5);
        transform: scale(.9);
      }

      50% {
        box-shadow: 0 0 20px rgba(220, 18, 38, 1);
        transform: scale(1.08);
      }
    }

    @keyframes titleGhost {

      0%,
      92%,
      100% {
        translate: 0 0;
      }

      93% {
        translate: -2px 0;
      }

      94% {
        translate: 3px 0;
      }

      95% {
        translate: 0 0;
      }
    }

    @keyframes glyphFloat {

      0%,
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      50% {
        transform: translate3d(0, -14px, 0) rotate(2deg);
      }
    }

    @keyframes socialPop {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.72) rotate(-5deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    @keyframes playerGlow {

      0%,
      100% {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 18px 55px rgba(0, 0, 0, .42), 0 0 0 rgba(197, 18, 38, 0);
      }

      50% {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 22px 65px rgba(0, 0, 0, .5), 0 0 38px rgba(197, 18, 38, .11);
      }
    }

    @keyframes coverPulse {

      0%,
      100% {
        transform: scale(1);
        filter: saturate(.9) brightness(.9);
      }

      50% {
        transform: scale(1.035);
        filter: saturate(1.08) brightness(1);
      }
    }

    @keyframes playingBars {

      0%,
      100% {
        transform: scaleY(.4);
      }

      50% {
        transform: scaleY(1);
      }
    }

    @keyframes entryBreath {

      0%,
      100% {
        opacity: .82;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.025);
      }
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      overflow: hidden auto;
      padding: 44px 22px;
      perspective: 1200px;
      background:
        linear-gradient(rgba(2, 3, 4, .4), rgba(1, 3, 7, .58));
    }

    .grain,
    .grid,
    .pointer-glow,
    .orb,
    .glyphs {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      z-index: -1;
      opacity: .12;
      background:
        repeating-radial-gradient(circle at 31% 37%, transparent 0 1px, rgba(255, 255, 255, .08) 1px 2px, transparent 2px 4px),
        repeating-linear-gradient(121deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 5px);
      background-size: 19px 21px, 13px 17px;
      mix-blend-mode: screen;
      animation: grainShift 9s steps(8) infinite alternate;
    }

    .grid {
      display: none;
    }

    .pointer-glow {
      z-index: -2;
      background: radial-gradient(340px circle at var(--pointer-x) var(--pointer-y), rgba(196, 18, 38, .15), transparent 70%);
    }

    .orb {
      display: none;
    }

    .orb-one {
      width: 480px;
      height: 480px;
      inset: -260px auto auto -170px;
      border: 1px solid rgba(160, 18, 38, .16);
      box-shadow: inset 0 0 120px rgba(142, 18, 38, .08);
    }

    .orb-two {
      width: 660px;
      height: 660px;
      inset: auto -380px -420px auto;
      border: 1px solid rgba(160, 18, 38, .12);
    }

    .profile {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --move-x: 0px;
      --move-y: 0px;
      --hover-lift: 0px;
      --card-scale: .98;
      --shine-x: 50%;
      --shine-y: 35%;
      position: relative;
      width: 92vw;
      max-width: 500px;
      padding: 52px 48px 34px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .006) 40%, rgba(126, 18, 38, .018) 76%, rgba(255, 255, 255, .025)),
        rgba(3, 6, 10, .025);
      box-shadow:
        0 34px 110px rgba(0, 0, 0, .32),
        inset 0 1px 0 rgba(255, 255, 255, .11),
        inset 0 -1px 0 rgba(255, 255, 255, .025);
      backdrop-filter: blur(3px) saturate(130%);
      -webkit-backdrop-filter: blur(3px) saturate(130%);
      text-align: center;
      transform: translate3d(var(--move-x), calc(18px + var(--move-y) + var(--hover-lift)), 0) scale(var(--card-scale)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      will-change: transform;
      opacity: 0;
      transition: opacity .9s ease .18s, transform .14s cubic-bezier(.2, .8, .2, 1), max-width .42s cubic-bezier(.16, 1, .3, 1), padding .42s cubic-bezier(.16, 1, .3, 1), border-color .3s ease, box-shadow .3s ease;
    }

    .entered .profile {
      --card-scale: 1;
      transform: translate3d(var(--move-x), calc(var(--move-y) + var(--hover-lift)), 0) scale(var(--card-scale)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      opacity: 1;
    }

    .profile::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, .025) 24%, rgba(216, 18, 38, .1) 72%, rgba(255, 255, 255, .12));
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .profile::after {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 0;
      border-radius: 35px;
      background: radial-gradient(260px circle at var(--shine-x) var(--shine-y), rgba(255, 255, 255, .24), rgba(255, 255, 255, .055) 30%, transparent 68%);
      mix-blend-mode: screen;
      opacity: .42;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .profile:hover {
      --hover-lift: -6px;
      max-width: 514px;
      padding: 58px 54px 40px;
      border-color: rgba(255, 255, 255, .37);
      box-shadow:
        0 44px 130px rgba(0, 0, 0, .4),
        inset 0 1px 0 rgba(255, 255, 255, .18),
        inset 0 -1px 0 rgba(255, 255, 255, .035),
        0 0 80px rgba(139, 18, 38, .09);
    }

    .profile:hover::after {
      opacity: .72;
    }

    .profile>* {
      position: relative;
      z-index: 1;
    }

    .profile .avatar-wrap,
    .profile .eyebrow,
    .profile h1,
    .profile .bio,
    .profile .socials,
    .profile footer,
    .profile .corner {
      opacity: 0;
    }

    .entered .profile .corner {
      animation: elementRise .6s .22s both;
    }

    .entered .profile .avatar-wrap {
      animation: elementRise .82s .3s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .eyebrow {
      animation: elementRise .7s .4s both;
    }

    .entered .profile h1 {
      animation: elementRise .78s .48s cubic-bezier(.16, 1, .3, 1) both, titleGhost 7s 2s infinite;
    }

    .entered .profile .bio {
      animation: elementRise .7s .58s both;
    }

    .entered .profile .socials {
      animation: elementRise .7s .68s both;
    }

    .entered .profile footer {
      animation: elementRise .7s .78s both;
    }

    .avatar-wrap {
      transform: translateZ(24px);
    }

    .profile h1 {
      transform: translateZ(18px);
    }

    .corner {
      position: absolute;
      color: rgba(229, 38, 55, .5);
      font: 10px/1 monospace;
      letter-spacing: .18em;
    }

    .corner-top {
      top: 18px;
      left: 21px;
    }

    .corner-bottom {
      right: 20px;
      bottom: 18px;
    }

    .avatar-wrap {
      position: relative;
      width: 144px;
      margin: 0 auto 27px;
    }

    .avatar-ring {
      position: relative;
      width: 144px;
      height: 144px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f24a5a, #4d0010 54%, #df1228);
      box-shadow: 0 0 38px rgba(191, 18, 38, .22), 0 14px 42px rgba(0, 0, 0, .6);
    }

    .avatar-ring::after {
      content: "";
      position: absolute;
      inset: -9px;
      border: 1px solid transparent;
      border-top-color: rgba(242, 38, 55, .52);
      border-right-color: rgba(242, 38, 55, .08);
      border-radius: 50%;
      animation: ringOrbit 9s linear infinite;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(.7) contrast(1.08) brightness(.86);
    }

    .status {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 15px;
      height: 15px;
      border: 3px solid #060b11;
      border-radius: 50%;
      background: #dc1226;
      box-shadow: 0 0 15px rgba(220, 18, 38, .8);
      animation: statusPulse 2s ease-in-out infinite;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 6px;
      color: rgba(199, 212, 231, .52);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .eyebrow i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e0142c;
      box-shadow: 0 0 8px #e0142c;
    }

    h1 {
      position: relative;
      display: inline-block;
      margin: 0;
      color: #f7faff;
      font-size: clamp(48px, 13vw, 66px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.08em;
      text-shadow: 0 0 32px rgba(213, 18, 38, .16);
    }

    h1::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      z-index: -1;
      color: #ca1228;
      transform: translate(3px, 1px);
      opacity: .26;
      clip-path: inset(56% 0 21% 0);
    }

    .entry:focus-visible {
      outline: 2px solid #dc1226;
      outline-offset: 4px;
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-top: 17px;
    }

    .social {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(255, 91, 110, .1);
      border-radius: 13px;
      color: rgba(236, 241, 249, .65);
      background: rgba(255, 255, 255, .018);
      box-shadow: inset 0 0 14px rgba(208, 18, 38, .025);
      transition: color .25s ease, transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    }

    .social:hover {
      color: #f4f9ff;
      transform: translateY(-3px);
      border-color: rgba(226, 26, 55, .42);
      background: rgba(151, 18, 38, .1);
      box-shadow: 0 8px 24px rgba(139, 18, 38, .18), inset 0 0 18px rgba(208, 18, 38, .06);
    }

    .entered .social {
      animation: socialPop .55s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .social:nth-child(1) {
      animation-delay: .72s;
    }

    .social:focus-visible {
      outline: 2px solid #dc1226;
      outline-offset: 3px;
    }

    .social svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .music-player {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 8;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      grid-template-areas:
        "cover meta"
        "progress progress"
        "status status"
        "controls controls";
      align-items: center;
      gap: 7px 12px;
      width: min(336px, calc(100vw - 44px));
      margin-top: 18px;
      padding: 12px 14px 10px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 17px;
      background:
        radial-gradient(circle at 9% 0%, rgba(210, 18, 38, .15), transparent 42%),
        radial-gradient(circle at 92% 118%, rgba(112, 18, 38, .22), transparent 46%),
        linear-gradient(145deg, rgba(8, 13, 19, .88), rgba(6, 4, 6, .73));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 18px 55px rgba(0, 0, 0, .42);
      backdrop-filter: blur(24px) saturate(135%);
      -webkit-backdrop-filter: blur(24px) saturate(135%);
      transform: translate3d(-18px, 18px, 0) scale(.97);
      text-align: left;
      opacity: 0;
      transition: opacity .78s ease .32s, transform .85s cubic-bezier(.16, 1, .3, 1) .32s, border-color .25s ease, background .3s ease;
    }

    .music-player::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(110deg, transparent 18%, rgba(255, 255, 255, .06) 46%, transparent 68%);
      transform: translateX(-120%);
      transition: transform .85s cubic-bezier(.16, 1, .3, 1);
    }

    .music-player::after {
      content: "";
      position: absolute;
      inset: auto -35px -58px auto;
      z-index: -1;
      width: 145px;
      height: 110px;
      border-radius: 50%;
      background: rgba(201, 18, 38, .14);
      filter: blur(30px);
      opacity: .55;
      transition: opacity .3s ease, transform .3s ease;
    }

    .entered .music-player {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 1;
      animation: playerGlow 6s 1.2s ease-in-out infinite;
    }

    .music-player:hover {
      border-color: rgba(255, 255, 255, .24);
      background:
        radial-gradient(circle at 9% 0%, rgba(220, 18, 38, .2), transparent 42%),
        radial-gradient(circle at 92% 118%, rgba(130, 18, 38, .28), transparent 46%),
        linear-gradient(145deg, rgba(9, 14, 22, .92), rgba(7, 4, 6, .78));
    }

    .music-player:hover::before {
      transform: translateX(120%);
    }

    .playing .music-player::after {
      opacity: .95;
      transform: scale(1.2);
    }

    .music-player>* {
      position: relative;
      z-index: 1;
    }

    .album-cover {
      grid-area: cover;
      display: block;
      width: 58px;
      height: 58px;
      border-radius: 9px;
      object-fit: cover;
      filter: saturate(.9) brightness(.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .48), 0 0 0 1px rgba(255, 255, 255, .1);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1), filter .35s ease;
    }

    .music-player:hover .album-cover {
      transform: scale(1.04) rotate(-1deg);
      filter: saturate(1) brightness(.96);
    }

    .playing .album-cover {
      animation: coverPulse 2.4s ease-in-out infinite;
    }

    .track-info {
      display: contents;
      min-width: 0;
    }

    .track-line {
      grid-area: meta;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      min-width: 0;
    }

    .track-title {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      color: rgba(247, 250, 255, .96);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-subtitle {
      width: 100%;
      overflow: hidden;
      color: rgba(214, 223, 235, .48);
      font-size: 10.5px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress {
      grid-area: progress;
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      appearance: none;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(90deg, #dc1226 var(--played, 0%), rgba(255, 255, 255, .16) var(--played, 0%));
      box-shadow: 0 0 9px rgba(220, 18, 38, .08);
      transition: height .2s ease;
    }

    .progress:hover {
      height: 6px;
    }

    .progress::-webkit-slider-thumb {
      width: 10px;
      height: 10px;
      appearance: none;
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      background: #dc1226;
      box-shadow: 0 0 10px rgba(220, 18, 38, .72);
    }

    .progress::-moz-range-thumb {
      width: 7px;
      height: 7px;
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      background: #dc1226;
      box-shadow: 0 0 10px rgba(220, 18, 38, .72);
    }

    .track-status {
      grid-area: status;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      color: rgba(211, 221, 234, .38);
      font: 9px/1 monospace;
    }

    .track-status .remaining {
      justify-self: end;
    }

    .player-controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .player-control {
      display: grid;
      width: 34px;
      height: 29px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(241, 247, 255, .58);
      background: transparent;
      cursor: pointer;
      transition: color .2s ease, background .2s ease, transform .25s cubic-bezier(.16, 1, .3, 1), box-shadow .2s ease;
    }

    .player-control:hover {
      color: #fff;
      background: rgba(255, 255, 255, .07);
      transform: translateY(-2px) scale(1.07);
    }

    .player-control.primary {
      width: 38px;
      height: 34px;
      color: #fff;
      background: rgba(220, 18, 38, .88);
      box-shadow: 0 5px 16px rgba(178, 18, 38, .3), inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .player-control.primary:hover {
      background: #ef2a3c;
      box-shadow: 0 8px 22px rgba(205, 18, 38, .42), inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .transport-icon {
      position: relative;
      display: block;
      width: 15px;
      height: 14px;
    }

    .transport-icon::before,
    .transport-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .transport-icon.back::before,
    .transport-icon.forward::after {
      width: 2px;
      height: 11px;
      border-radius: 2px;
      background: currentColor;
    }

    .transport-icon.back::before {
      left: 1px;
    }

    .transport-icon.forward::after {
      right: 1px;
    }

    .transport-icon.back::after,
    .transport-icon.forward::before {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .transport-icon.back::after {
      left: 3px;
      border-right: 9px solid currentColor;
    }

    .transport-icon.forward::before {
      right: 3px;
      border-left: 9px solid currentColor;
    }

    .play-icon {
      position: relative;
      display: block;
      width: 13px;
      height: 15px;
    }

    .play-icon::before {
      content: "";
      position: absolute;
      inset: 1px auto auto 3px;
      width: 0;
      height: 0;
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
      border-left: 10px solid currentColor;
      transition: opacity .15s ease, transform .15s ease;
    }

    .play-icon::after {
      content: "";
      position: absolute;
      inset: 1px 1px 1px 1px;
      opacity: 0;
      background: linear-gradient(90deg, currentColor 0 4px, transparent 4px 8px, currentColor 8px 12px);
      transform: scale(.8);
      transition: opacity .15s ease, transform .15s ease;
    }

    .is-playing .play-icon::before {
      opacity: 0;
      transform: scale(.7);
    }

    .is-playing .play-icon::after {
      opacity: 1;
      transform: scale(1);
    }

    .player-control:focus-visible {

    /* Bare, cinematic profile composition inspired by the supplied reference. */

      transition: filter 1.35s cubic-bezier(.16, 1, .3, 1), transform 1.5s cubic-bezier(.16, 1, .3, 1);

    .scene::before {

    .profile {
      --hover-lift: 0px;
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      grid-template-areas:
        "avatar eyebrow"
        "avatar name"
        "bio bio"
        "socials socials"
        "player player";
      gap: 8px 22px;

      max-width: 720px;

      background: rgba(8, 8, 8, .22);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .055);
      backdrop-filter: blur(12px) saturate(115%);
      -webkit-backdrop-filter: blur(12px) saturate(115%);
      text-align: left;
      transform: translate3d(var(--move-x), calc(22px + var(--move-y)), 0) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      scale: 1;
      transform-style: preserve-3d;
      will-change: transform, scale;
      opacity: 0;
      transition: opacity 1s ease .2s, transform .16s cubic-bezier(.2, .8, .2, 1), scale .32s cubic-bezier(.2, .8, .2, 1), border-color .25s ease, box-shadow .25s ease;
    }

    .entered .profile {
      transform: translate3d(var(--move-x), var(--move-y), 0) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      opacity: 1;
    }

    .profile:hover {
      --hover-lift: 0px;

      animation: cleanReveal .55s .82s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .track-line {
      animation: cleanRevealLeft .65s 1.08s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .player-controls {
      animation: cleanReveal .62s 1.16s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .progress {
      animation: lineReveal .78s 1.24s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .track-status {
      animation: cleanReveal .55s 1.33s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .sound-toggle {
      animation: controlReveal .72s .32s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .entry {
      visibility: visible;
      pointer-events: none;
      animation: entryExit .62s cubic-bezier(.4, 0, .2, 1) both;
    }

    .scene::before {
      transition-delay: .08s;
    }

    .profile::after {
      opacity: 0;
    }

    .entered .profile::after {
      opacity: .5;
      transition: opacity 1.2s ease .7s;
    }

    .entered .profile:hover::after {
      opacity: .85;
      transition-delay: 0s;
    }

    @media (max-width: 520px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      .scene {
        width: 100%;
        height: 100svh;
        min-height: 100svh;
        padding: 84px 15px 42px;
        overflow: hidden;
        overscroll-behavior: none;
      }

      .profile {
        width: min(92vw, 420px);
        max-width: 420px;
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 7px 16px;
        padding: 24px 22px;
        border-radius: 24px;
      }

      .profile:hover {
        max-width: 420px;
        padding: 24px 22px;
      }

      .avatar-wrap,
      .avatar-ring {
        width: 96px;
      }

      .avatar-ring {
        height: 96px;
        border-radius: 22px;
      }

      .avatar {
        border-radius: 19px;
      }

      .profile h1 {
        font-size: 34px;
      }

      .bio {
        margin: 10px 0 3px;
        font-size: 14px;
      }

      .glyphs span:nth-child(odd) {
        display: none;
      }

      .music-player {
        position: relative;
        inset: auto;
        width: 100%;
        grid-template-columns: 54px minmax(0, 1fr);
        grid-template-areas: "cover meta" "cover progress" "controls controls" "status status";
        gap: 7px 10px;
        padding: 0;
      }

      .album-cover {
        width: 54px;
        height: 54px;
      }

      .sound-toggle {
        top: 14px;
        left: 14px;
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>
  <div class="custom-cursor" id="custom-cursor" aria-hidden="true"></div>
  <main class="scene" id="scene">
    <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="background.mp4" type="video/mp4">
    </video>
    <div class="grain" aria-hidden="true"></div>
    <div class="snowfall" id="snowfall" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="pointer-glow" aria-hidden="true"></div>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <div class="glyphs" aria-hidden="true">
      <span>bare</span><span>bleed</span><span>//</span><span>×</span><span>+</span><span>barebleed</span>
    </div>

    <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Mute audio">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6.7 9H3.5v6h3.2l4.3 4z"></path>
        <path class="sound-wave" d="M15 8.2a5.2 5.2 0 0 1 0 7.6M17.8 5.6a8.8 8.8 0 0 1 0 12.8"></path>
      </svg>
    </button>

    <section class="profile" aria-label="barebleed profile">
      <span class="corner corner-top" aria-hidden="true">bare</span>
      <span class="corner corner-bottom" aria-hidden="true">bleed</span>

      <div class="avatar-wrap">
        <div class="avatar-ring">
          <img class="avatar" src="avatar.gif" alt="barebleed profile portrait">
        </div>
      </div>

      <p class="eyebrow"><i></i> he/him</p>
      <h1 data-text="barebleed">barebleed</h1>
      <p class="bio">c++ and web developer.<br> also known as a5wv or drizzy </p>

      <nav class="socials" aria-label="Social links">
        <button class="social" id="discord-open" type="button" aria-label="Discord" aria-haspopup="dialog"
          aria-controls="discord-picker">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037 19.7363 19.7363 0 0 0-4.8852 1.515.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.198.3728.2924a.077.077 0 0 1-.0066.1276 12.2986 12.2986 0 0 1-1.873.8914.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z">
            </path>
          </svg>
        </button>
      </nav>

      <section class="music-player" aria-label="Music player">
        <img class="album-cover" src="twig-cover.png" alt="twig cover art">
        <div class="track-info">
          <div class="track-line">
            <span class="track-title">twig</span>
            <span class="track-subtitle">yen</span>
          </div>
          <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="Song progress">
          <div class="track-status">
            <span id="current-time">0:00</span>
            <span class="remaining" id="duration">--:--</span>
          </div>
        </div>
        <div class="player-controls">
          <button class="player-control" id="skip-back" type="button" aria-label="Previous track"><span
              class="transport-icon back" aria-hidden="true"></span></button>
          <button class="player-control primary" id="play-toggle" type="button" aria-label="Play twig"><span
              class="play-icon" id="play-icon" aria-hidden="true"></span></button>
          <button class="player-control" id="skip-forward" type="button" aria-label="Next track"><span
              class="transport-icon forward" aria-hidden="true"></span></button>
        </div>
        <audio id="audio" preload="metadata" src="twig.mp3"></audio>
      </section>

      <footer>
        <span>somewhere online</span><b>✦</b><span>13:27</span>
      </footer>
    </section>

    <p class="signature" aria-hidden="true">NO SIGNAL / ONLY BAREBLEED</p>

    <button class="entry" id="entry" type="button">
      <span class="entry-number">barebleed</span>
      <span class="entry-line"></span>
      <span class="entry-copy">[ click to enter ]</span>
    </button>
  </main>

  <div class="discord-picker" id="discord-picker" role="dialog" aria-modal="true" aria-labelledby="discord-picker-title"
    hidden>
    <div class="discord-picker-panel">
      <p class="discord-picker-title" id="discord-picker-title">discord</p>
      <div class="discord-picker-options">
        <a class="discord-picker-option" href="https://discord.com/users/1352028232127352882" target="_blank"
          rel="noopener noreferrer nofollow">
          <span class="discord-picker-label">main</span>
          <span class="discord-picker-hint">@barebleed</span>
        </a>
        <a class="discord-picker-option" href="https://discord.com/users/1123597605113438351" target="_blank"
          rel="noopener noreferrer nofollow">
          <span class="discord-picker-label">alt</span>
          <span class="discord-picker-hint">@0271942</span>
        </a>
      </div>
    </div>
    <button class="discord-picker-close" id="discord-picker-close" type="button">[ close ]</button>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const entry = document.getElementById("entry");
    const profile = document.querySelector(".profile");
    const audio = document.getElementById("audio");
    const playToggle = document.getElementById("play-toggle");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("current-time");
    const duration = document.getElementById("duration");
    const skipBack = document.getElementById("skip-back");
    const skipForward = document.getElementById("skip-forward");
    const musicPlayer = document.querySelector(".music-player");
    const albumCover = document.querySelector(".album-cover");
    const trackTitle = document.querySelector(".track-title");
    const trackSubtitle = document.querySelector(".track-subtitle");
    const soundToggle = document.getElementById("sound-toggle");
    const bgVideo = document.querySelector(".bg-video");
    const customCursor = document.getElementById("custom-cursor");
    const discordOpen = document.getElementById("discord-open");
    const discordPicker = document.getElementById("discord-picker");
    const discordClose = document.getElementById("discord-picker-close");

    bgVideo.play().catch(() => { });

    const snowfall = document.getElementById("snowfall");
    const flakeCount = 28;

    for (let index = 0; index < flakeCount; index += 1) {
      const flake = document.createElement("span");
      const size = 1.2 + Math.random() * 1.8;
      flake.className = "snowflake";
      flake.style.left = `${Math.random() * 100}%`;
      flake.style.width = `${size}px`;
      flake.style.height = `${size}px`;
      flake.style.opacity = `${0.22 + Math.random() * 0.32}`;
      flake.style.setProperty("--drift", `${-8 + Math.random() * 16}px`);
      flake.style.animationDuration = `${14 + Math.random() * 16}s`;
      flake.style.animationDelay = `-${Math.random() * 18}s`;
      snowfall.appendChild(flake);
    }

    function openDiscordPicker() {
      discordPicker.hidden = false;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => discordPicker.classList.add("is-open"));
      });
      discordClose.focus();
    }

    function closeDiscordPicker() {
      discordPicker.classList.remove("is-open");
      const finish = () => {
        if (!discordPicker.classList.contains("is-open")) discordPicker.hidden = true;
      };
      discordPicker.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 320);
      discordOpen.focus();
    }

    discordOpen.addEventListener("click", openDiscordPicker);
    discordClose.addEventListener("click", closeDiscordPicker);
    discordPicker.addEventListener("click", event => {
      if (event.target === discordPicker) closeDiscordPicker();
    });
    discordPicker.querySelectorAll(".discord-picker-option").forEach(option => {
      option.addEventListener("click", () => closeDiscordPicker());
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && discordPicker.classList.contains("is-open")) {
        event.preventDefault();
        closeDiscordPicker();
      }
    });

    const cursorPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const cursorTarget = { x: cursorPos.x, y: cursorPos.y };
    const cursorEase = 0.14;
    const cursorScale = { current: 1, target: 1 };
    const cursorScaleEase = 0.22;

    function renderCursor() {
      cursorPos.x += (cursorTarget.x - cursorPos.x) * cursorEase;
      cursorPos.y += (cursorTarget.y - cursorPos.y) * cursorEase;
      cursorScale.current += (cursorScale.target - cursorScale.current) * cursorScaleEase;
      customCursor.style.transform = `translate(${cursorPos.x}px, ${cursorPos.y}px) scale(${cursorScale.current})`;
      requestAnimationFrame(renderCursor);
    }

    if (window.matchMedia("(pointer: fine)").matches) {
      window.addEventListener("pointermove", event => {
        cursorTarget.x = event.clientX;
        cursorTarget.y = event.clientY;
        customCursor.classList.add("is-visible");
      });
      window.addEventListener("pointerdown", () => {
        cursorScale.target = 0.82;
      });
      window.addEventListener("pointerup", () => {
        cursorScale.target = 1;
      });
      window.addEventListener("pointercancel", () => {
        cursorScale.target = 1;
      });
      document.addEventListener("mouseleave", () => {
        customCursor.classList.remove("is-visible");
        cursorScale.target = 1;
      });
      document.documentElement.addEventListener("mouseenter", () => customCursor.classList.add("is-visible"));
      renderCursor();
    } else {
      document.documentElement.style.setProperty("cursor", "auto");
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "--:--";
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainder}`;
    }

    function syncProgress() {
      const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
      progress.value = Math.round(ratio * 1000);
      progress.style.setProperty("--played", `${ratio * 100}%`);
      currentTime.textContent = formatTime(audio.currentTime);
      duration.textContent = Number.isFinite(audio.duration)
        ? `-${formatTime(Math.max(0, audio.duration - audio.currentTime))}`
        : "--:--";
    }

    const playlist = [
      { title: "twig", artist: "yen", src: "twig.mp3", cover: "twig-cover.png" },
      { title: "feel my wrath", artist: "yen", src: "feel-my-wrath.mp3", cover: "feel-my-wrath-cover.png" },
      { title: "bastard", artist: "yen", src: "bastard.mp3", cover: "bastard-cover.png" },
      { title: "i keep calling ...", artist: "wifiskeleton, jaydes", src: "i-keep-calling.mp3", cover: "i-keep-calling-cover.png" },
      { title: "i'm a piece of shit", artist: "yen", src: "im-a-piece-of-shit.mp3", cover: "im-a-piece-of-shit-cover.png" },
    ];

    let trackIndex = 0;
    let isSwitching = false;
    const switchMs = 240;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function updateTrackLabels() {
      const track = playlist[trackIndex];
      musicPlayer.setAttribute("aria-label", `Music player for ${track.title}`);
      playToggle.setAttribute("aria-label", audio.paused ? `Play ${track.title}` : `Pause ${track.title}`);
    }

    function applyTrack(index) {
      trackIndex = (index + playlist.length) % playlist.length;
      const track = playlist[trackIndex];
      audio.src = track.src;
      albumCover.src = track.cover;
      albumCover.alt = `${track.title} cover art`;
      trackTitle.textContent = track.title;
      trackSubtitle.textContent = track.artist;
      progress.value = 0;
      progress.style.setProperty("--played", "0%");
      currentTime.textContent = "0:00";
      duration.textContent = "--:--";
      audio.load();
      updateTrackLabels();
    }

    async function loadTrack(index, autoplay = false) {
      const nextIndex = (index + playlist.length) % playlist.length;
      if (isSwitching || nextIndex === trackIndex) return;

      isSwitching = true;
      const wasPlaying = autoplay || !audio.paused;
      musicPlayer.classList.add("is-switching");

      await wait(switchMs / 2);
      if (wasPlaying) audio.pause();
      applyTrack(nextIndex);
      await wait(switchMs / 2);
      musicPlayer.classList.remove("is-switching");

      if (wasPlaying) audio.play().catch(() => { });
      isSwitching = false;
    }

    function changeTrack(delta) {
      loadTrack(trackIndex + delta, !audio.paused);
    }

    function enterProfile() {
      scene.classList.add("entered");
      entry.setAttribute("aria-hidden", "true");
      entry.tabIndex = -1;
      audio.play().catch(() => { });
    }

    entry.addEventListener("click", enterProfile);
    window.addEventListener("keydown", event => {
      if (!scene.classList.contains("entered") && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        enterProfile();
      }
    });

    scene.addEventListener("pointermove", event => {
      document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
      document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
    });

    profile.addEventListener("pointermove", event => {
      const bounds = profile.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      profile.style.setProperty("--tilt-x", `${(0.5 - y) * 5}deg`);
      profile.style.setProperty("--tilt-y", `${(x - 0.5) * 7}deg`);
      profile.style.setProperty("--move-x", `${(x - 0.5) * 10}px`);
      profile.style.setProperty("--move-y", `${(y - 0.5) * 8}px`);
      profile.style.setProperty("--shine-x", `${x * 100}%`);
      profile.style.setProperty("--shine-y", `${y * 100}%`);
    });

    profile.addEventListener("pointerleave", () => {
      profile.style.setProperty("--tilt-x", "0deg");
      profile.style.setProperty("--tilt-y", "0deg");
      profile.style.setProperty("--move-x", "0px");
      profile.style.setProperty("--move-y", "0px");
      profile.style.setProperty("--shine-x", "50%");
      profile.style.setProperty("--shine-y", "35%");
    });

    playToggle.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => { });
      } else {
        audio.pause();
      }
    });

    skipBack.addEventListener("click", () => changeTrack(-1));

    skipForward.addEventListener("click", () => changeTrack(1));

    soundToggle.addEventListener("click", () => {
      audio.muted = !audio.muted;
      soundToggle.classList.toggle("is-muted", audio.muted);
      soundToggle.setAttribute("aria-label", audio.muted ? "Unmute audio" : "Mute audio");
    });

    progress.addEventListener("input", () => {
      if (!audio.duration) return;
      audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
      syncProgress();
    });

    audio.addEventListener("loadedmetadata", () => {
      syncProgress();
    });

    audio.addEventListener("timeupdate", syncProgress);
    audio.addEventListener("ended", () => loadTrack(trackIndex + 1, true));
    audio.addEventListener("play", () => {
      playToggle.classList.add("is-playing");
      scene.classList.add("playing");
      updateTrackLabels();
    });
    audio.addEventListener("pause", () => {
      playToggle.classList.remove("is-playing");
      scene.classList.remove("playing");
      updateTrackLabels();
    });

  </script>
</body>
