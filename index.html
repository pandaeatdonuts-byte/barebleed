<!doctype html>
<html lang="en">

<head>
  <meta name="twitter:card" content="summary">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050405">
  <meta name="description" content="Hi">
  <title>barebleed</title>
  <link rel="icon" type="image/png" href="cursor.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #050405;
      --accent: #dc1226;
      --frost: #e9eef5;
      --pointer-x: 50vw;
      --pointer-y: 50vh;
    }

    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      pointer-events: none;
      opacity: 0;
      background: url("cursor.png") center / contain no-repeat;
      will-change: transform;
      transition: opacity .2s ease;
    }

    .custom-cursor.is-visible {
      opacity: 1;
    }

    @media (pointer: coarse) {

      *,
      *::before,
      *::after {
        cursor: auto !important;
      }

      .custom-cursor {
        display: none;
      }
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      color: var(--frost);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    @keyframes grainShift {
      0% {
        transform: translate3d(-1.5%, -1%, 0);
      }

      100% {
        transform: translate3d(1.5%, 1%, 0);
      }
    }

    @keyframes snowFall {
      from {
        transform: translate3d(0, -4vh, 0);
      }

      to {
        transform: translate3d(var(--drift), 108vh, 0);
      }
    }

    @keyframes cdDrop {
      from {
        opacity: 0;
        scale: .82;
        filter: blur(8px);
      }

      to {
        opacity: 1;
        scale: 1;
        filter: blur(0);
      }
    }

    @keyframes cleanReveal {
      from {
        opacity: 0;
        translate: 0 15px;
        filter: blur(5px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes cleanRevealLeft {
      from {
        opacity: 0;
        translate: -12px 0;
        filter: blur(4px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes cleanRevealDown {
      from {
        opacity: 0;
        translate: 0 -15px;
        filter: blur(5px);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }
    }

    @keyframes lineReveal {
      from {
        opacity: 0;
        translate: 0 6px;
        filter: blur(4px);
        clip-path: inset(0 100% 0 0);
      }

      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes entryExit {
      from {
        opacity: 1;
        translate: 0 0;
        filter: blur(0);
      }

      to {
        opacity: 0;
        translate: 0 -12px;
        filter: blur(8px);
      }
    }

    @keyframes entryBreath {

      0%,
      100% {
        opacity: .82;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.03);
      }
    }

    @keyframes cdSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes eqDance {
      from {
        transform: scaleY(.26);
      }

      to {
        transform: scaleY(1);
      }
    }

    .scene {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      background: #030303;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .07;
      background:
        repeating-radial-gradient(circle at 31% 37%, transparent 0 1px, rgba(255, 255, 255, .08) 1px 2px, transparent 2px 4px),
        repeating-linear-gradient(121deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 5px);
      background-size: 19px 21px, 13px 17px;
      mix-blend-mode: screen;
      animation: grainShift 9s steps(8) infinite alternate;
    }

    .bg-video {
      position: fixed;
      inset: -34px;
      z-index: -3;
      width: calc(100% + 68px);
      height: calc(100% + 68px);
      object-fit: cover;
      pointer-events: none;
      filter: grayscale(1) blur(22px) brightness(.58) saturate(.82);
      transform: scale(1.08);
      transition: filter 1.35s cubic-bezier(.16, 1, .3, 1), transform 1.5s cubic-bezier(.16, 1, .3, 1);
    }

    .entered .bg-video {
      filter: grayscale(.55) blur(2px) brightness(.78) contrast(1.02) saturate(1.05);
      transform: scale(1);
    }

    .scene::before {
      content: "";
      position: fixed;
      inset: -18px;
      z-index: -2;
      background: linear-gradient(rgba(2, 3, 4, .28), rgba(2, 3, 4, .48));
      transition: filter 1.35s cubic-bezier(.16, 1, .3, 1), transform 1.5s cubic-bezier(.16, 1, .3, 1);
    }

    .entered.scene::before {
      background: linear-gradient(rgba(2, 4, 6, .16), rgba(1, 3, 5, .38));
    }

    .pointer-glow {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(340px circle at var(--pointer-x) var(--pointer-y), rgba(196, 18, 38, .12), transparent 70%);
    }

    .snowfall {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      opacity: .72;
    }

    .snowflake {
      position: absolute;
      top: -4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 0 6px rgba(255, 255, 255, .18);
      animation: snowFall linear infinite;
      will-change: transform;
    }

    /* Music control bar, top-right of the viewport. */
    .music-player {
      position: fixed;
      top: 24px;
      right: 26px;
      left: auto;
      bottom: auto;
      z-index: 9;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "meta controls"
        "progress progress"
        "status status";
      align-items: center;
      gap: 6px 18px;
      width: clamp(320px, 44vw, 640px);
      padding: 13px 16px 9px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 16px;
      background:
        radial-gradient(120% 160% at 42% -12%, rgba(255, 255, 255, .14), transparent 42%),
        linear-gradient(160deg, rgba(16, 16, 18, .78), rgba(8, 8, 10, .72));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 22px 60px rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      transform: translateY(-16px);
      opacity: 0;
      transition: opacity .8s ease .3s, transform .9s cubic-bezier(.16, 1, .3, 1) .3s;
    }

    .entered .music-player {
      transform: translateY(0);
      opacity: 1;
    }

    .music-player>* {
      position: relative;
      z-index: 1;
    }

    .track-line {
      grid-area: meta;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      min-width: 0;
    }

    .track-title {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      color: rgba(255, 255, 255, .96);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .01em;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: opacity .3s ease;
    }

    .track-subtitle {
      width: 100%;
      overflow: hidden;
      color: rgba(255, 255, 255, .48);
      font-size: 11px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 2px;
      transition: opacity .3s ease;
    }

    .player-controls {
      grid-area: controls;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .player-control {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(255, 255, 255, .92);
      background: transparent;
      transition: transform .25s cubic-bezier(.16, 1, .3, 1), color .2s ease, box-shadow .2s ease;
    }

    .player-control:hover {
      color: #fff;
      transform: scale(1.1);
    }

    .player-control.primary {
      width: 44px;
      height: 44px;
      color: #101113;
      background: #fff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .8);
    }

    .player-control.primary:hover {
      transform: scale(1.07);
      box-shadow: 0 14px 32px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .8);
    }

    .transport-icon {
      position: relative;
      display: block;
      width: 16px;
      height: 14px;
    }

    .transport-icon::before,
    .transport-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .transport-icon.back::before,
    .transport-icon.forward::after {
      width: 2px;
      height: 12px;
      border-radius: 2px;
      background: currentColor;
    }

    .transport-icon.back::before {
      left: 1px;
    }

    .transport-icon.forward::after {
      right: 1px;
    }

    .transport-icon.back::after,
    .transport-icon.forward::before {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .transport-icon.back::after {
      left: 3px;
      border-right: 9px solid currentColor;
    }

    .transport-icon.forward::before {
      right: 3px;
      border-left: 9px solid currentColor;
    }

    .play-icon {
      position: relative;
      display: block;
      width: 14px;
      height: 16px;
      margin-left: 1px;
    }

    .play-icon::before {
      content: "";
      position: absolute;
      inset: 1px auto auto 3px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid currentColor;
      transition: opacity .15s ease, transform .15s ease;
    }

    .play-icon::after {
      content: "";
      position: absolute;
      inset: 1px;
      opacity: 0;
      background: linear-gradient(90deg, currentColor 0 4px, transparent 4px 8px, currentColor 8px 12px);
      transform: scale(.8);
      transition: opacity .15s ease, transform .15s ease;
    }

    .is-playing .play-icon::before {
      opacity: 0;
      transform: scale(.7);
      margin-left: 0;
    }

    .is-playing .play-icon::after {
      opacity: 1;
      transform: scale(1);
    }

    .player-control:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 2px;
    }

    .progress {
      grid-area: progress;
      position: relative;
      z-index: 4;
      display: block;
      width: 100%;
      height: 14px;
      margin: 1px 0 -4px;
      padding: 0;
      appearance: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      outline: none;
      cursor: pointer;
      pointer-events: auto;
    }

    .progress::-webkit-slider-runnable-track {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff var(--played, 0%), rgba(255, 255, 255, .22) var(--played, 0%));
    }

    .progress::-webkit-slider-thumb {
      width: 7px;
      height: 7px;
      margin-top: -2.5px;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }

    .progress:hover::-webkit-slider-thumb,
    .progress:focus-visible::-webkit-slider-thumb,
    .progress:active::-webkit-slider-thumb {
      opacity: .9;
    }

    .progress::-moz-range-track {
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .22);
    }

    .progress::-moz-range-progress {
      height: 2px;
      border-radius: 999px;
      background: #fff;
    }

    .progress::-moz-range-thumb {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: .9;
      transition: opacity .18s ease;
    }

    .track-status {
      grid-area: status;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      color: rgba(255, 255, 255, .58);
      font: 9px/1 monospace;
    }

    .track-status .remaining {
      justify-self: end;
    }

    .track-line,
    .player-controls,
    .progress,
    .track-status {
      transition: opacity .3s ease;
    }

    .music-player .track-line,
    .music-player .player-controls,
    .music-player .progress,
    .music-player .track-status {
      opacity: 0;
    }

    .entered .music-player .track-line {
      animation: cleanRevealLeft .65s .5s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .player-controls {
      animation: cleanReveal .62s .56s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .progress {
      animation: cleanRevealLeft .7s .62s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .music-player .track-status {
      animation: cleanReveal .55s .7s cubic-bezier(.16, 1, .3, 1) both;
    }

    .music-player.is-switching .track-title,
    .music-player.is-switching .track-subtitle {
      opacity: 0;
    }

    .scene.is-switching .cd-disc {
      opacity: .18;
    }

    /* Spinning CD on the left, artwork from the current track. */
    .cd-wrap {
      position: fixed;
      left: 4.5vw;
      top: 50%;
      z-index: 4;
      width: clamp(300px, 36vw, 540px);
      aspect-ratio: 1;
      transform: translate3d(-26px, calc(-50% + 18px), 0);
      opacity: 0;
      pointer-events: none;
      transition: opacity .9s ease .45s, transform 1s cubic-bezier(.16, 1, .3, 1) .45s;
    }

    .entered .cd-wrap {
      transform: translate3d(0, -50%, 0);
      opacity: 1;
      animation: cdDrop .9s .5s cubic-bezier(.16, 1, .3, 1) both;
    }

    .cd-disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      will-change: transform;
      transition: opacity .26s ease;
    }

    .playing .cd-disc {
      animation: cdSpin 4.2s linear infinite;
    }

    .cd-artwork {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, .18),
        inset 0 0 60px rgba(255, 255, 255, .06),
        0 50px 110px rgba(0, 0, 0, .55);
      transition: opacity .3s ease;
      filter: saturate(1.02);
    }

    .cd-sheen {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from 188deg at 50% 50%,
          rgba(255, 40, 40, .62),
          rgba(255, 180, 0, .5) 7%,
          rgba(255, 255, 60, .42) 13%,
          rgba(60, 255, 130, .5) 19%,
          rgba(40, 230, 255, .62) 27%,
          rgba(40, 110, 255, .55) 35%,
          rgba(150, 60, 255, .5) 43%,
          rgba(255, 50, 230, .45) 51%,
          rgba(255, 40, 60, .55) 58%,
          rgba(20, 20, 30, .68) 66%,
          rgba(20, 20, 30, .72) 78%,
          rgba(140, 90, 255, .4) 85%,
          rgba(255, 60, 40, .55) 93%,
          rgba(255, 40, 40, .62) 100%);
      mix-blend-mode: color-dodge;
      opacity: .68;
      filter: blur(1.4px) saturate(1.5);
    }

    .cd-sheen::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .05) 0 1px, transparent 1px 5px),
        radial-gradient(58% 58% at 30% 26%, rgba(255, 255, 255, .5), rgba(255, 255, 255, .08) 38%, transparent 62%);
      mix-blend-mode: screen;
      opacity: .8;
    }

    .cd-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      width: 31%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle,
          #fbfbfd 0 24%,
          #d9dbe1 24% 26%,
          #2a2d34 26% 38%,
          #1b1d23 38% 46%,
          rgba(28, 30, 36, .5) 47% 52%,
          rgba(16, 16, 20, 0) 56%);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
    }

    /* Profile card, right side, slightly tilted. */
    .profile {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --move-x: 0px;
      --move-y: 0px;
      --shine-x: 50%;
      --shine-y: 35%;
      position: fixed;
      right: 5vw;
      top: 50%;
      z-index: 5;
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      grid-template-areas:
        "avatar head"
        "bio bio"
        "socials socials";
      gap: 14px 26px;
      width: clamp(320px, 44vw, 620px);
      padding: 30px 34px 30px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 26px;
      background:
        radial-gradient(92% 130% at 16% 4%, rgba(255, 255, 255, .16), transparent 46%),
        radial-gradient(70% 110% at 92% 64%, rgba(255, 255, 255, .06), transparent 54%),
        linear-gradient(150deg, rgba(14, 14, 16, .62), rgba(7, 7, 9, .58));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 34px 90px rgba(0, 0, 0, .44);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      transform: translate3d(var(--move-x), calc(-50% + 22px + var(--move-y)), 0) rotate(2.3deg) perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      will-change: transform;
      opacity: 0;
      transition: opacity .95s ease .62s, transform .16s cubic-bezier(.2, .8, .2, 1), border-color .25s ease, box-shadow .25s ease;
    }

    .entered .profile {
      transform: translate3d(var(--move-x), calc(-50% + var(--move-y)), 0) rotate(2.3deg) perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      opacity: 1;
    }

    .profile::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .03) 30%, rgba(216, 18, 38, .12) 74%, rgba(255, 255, 255, .1));
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .profile::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background: radial-gradient(300px circle at var(--shine-x) var(--shine-y), rgba(255, 255, 255, .12), transparent 70%);
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .entered .profile::after {
      opacity: .6;
      transition: opacity 1s ease .8s;
    }

    .entered .profile:hover::after {
      opacity: .92;
      transition-delay: 0s;
    }

    .profile>* {
      position: relative;
      z-index: 1;
    }

    .avatar-wrap {
      grid-area: avatar;
      align-self: center;
      justify-self: start;
      width: 104px;
      transform: translateZ(18px);
    }

    .avatar-ring {
      position: relative;
      width: 104px;
      height: 104px;
      padding: 3px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .7), rgba(196, 18, 38, .9) 58%, rgba(255, 255, 255, .14));
      box-shadow: 0 14px 38px rgba(0, 0, 0, .42), 0 0 30px rgba(160, 18, 38, .16);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 21px;
      object-fit: cover;
      filter: saturate(.92) brightness(.92);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1), filter .35s ease;
    }

    .avatar-wrap:hover .avatar {
      transform: scale(1.04) rotate(-1deg);
      filter: saturate(1) brightness(1);
    }

    .head {
      grid-area: head;
      min-width: 0;
      transform: translateZ(12px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      margin: 0 0 4px;
      color: rgba(255, 255, 255, .55);
      font: 600 10px/1 Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: lowercase;
    }

    .eyebrow i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #e0142c;
      box-shadow: 0 0 8px #e0142c;
    }

    .profile h1 {
      margin: 0;
      color: #fff;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(40px, 4.8vw, 56px);
      line-height: 1;
      letter-spacing: -.015em;
      text-align: left;
      text-transform: lowercase;
      text-shadow: 0 5px 28px rgba(0, 0, 0, .42), 0 0 30px rgba(178, 18, 38, .16);
    }

    .bio {
      grid-area: bio;
      width: 100%;
      margin: 2px 0 0;
      color: rgba(255, 255, 255, .66);
      font: italic 500 clamp(14px, 1.7vw, 16px)/1.45 Georgia, "Times New Roman", serif;
      text-align: left;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .75);
      transform: translateZ(8px);
    }

    .socials {
      grid-area: socials;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin: 2px 0 0;
      transform: translateZ(8px);
    }

    .social {
      display: grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 0;
      color: #5865f2;
      background: transparent;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, .42));
      transition: transform .3s cubic-bezier(.16, 1, .3, 1), color .25s ease;
    }

    .social:hover {
      color: #fff;
      transform: translateY(-4px) scale(1.08);
    }

    .social:focus-visible {
      outline: 2px solid #dc1226;
      outline-offset: 3px;
    }

    .social svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    button.social {
      padding: 0;
      appearance: none;
    }

    .profile .avatar-wrap,
    .profile .head,
    .profile .bio,
    .profile .socials,
    .profile .social {
      opacity: 0;
    }

    .entered .profile .avatar-wrap {
      animation: cleanReveal .78s .72s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .head {
      animation: cleanRevealLeft .74s .8s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .bio {
      animation: cleanRevealLeft .68s .88s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .socials {
      animation: cleanReveal .7s .95s cubic-bezier(.16, 1, .3, 1) both;
    }

    .entered .profile .social {
      animation: socialPop .55s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes socialPop {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.72) rotate(-5deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    /* Volume dock and equalizer, bottom-left. */
    .audio-dock {
      position: fixed;
      left: 42px;
      bottom: 36px;
      z-index: 9;
      display: flex;
      align-items: flex-end;
      gap: 20px;
      opacity: 0;
      transition: opacity .8s ease .62s;
    }

    .entered .audio-dock {
      opacity: 1;
      animation: cleanReveal .7s .66s cubic-bezier(.16, 1, .3, 1) both;
    }

    .eq {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      height: 96px;
      pointer-events: none;
    }

    .eq span {
      display: block;
      width: 9px;
      border-radius: 5px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 0 12px rgba(255, 255, 255, .12);
      transform-origin: bottom;
      transform: scaleY(.28);
      transition: transform .5s cubic-bezier(.16, 1, .3, 1);
      will-change: transform;
    }

    .playing .eq span {
      animation: eqDance var(--dur, 1.1s) var(--del, 0s) ease-in-out infinite alternate;
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }

    .sound-toggle {
      display: grid;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(255, 255, 255, .92);
      background: transparent;
      transition: background .2s ease, transform .25s cubic-bezier(.16, 1, .3, 1);
    }

    .sound-toggle:hover {
      background: rgba(255, 255, 255, .12);
      transform: scale(1.07);
    }

    .sound-toggle:focus-visible {
      outline: 2px solid rgba(255, 255, 255, .8);
      outline-offset: 2px;
    }

    .sound-toggle svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sound-toggle.is-muted .sound-wave {
      opacity: .18;
    }

    .volume-slider {
      display: block;
      width: 140px;
      height: 14px;
      margin: 0;
      padding: 0;
      appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff var(--filled, 80%), rgba(255, 255, 255, .24) var(--filled, 80%));
    }

    .volume-slider::-webkit-slider-thumb {
      width: 7px;
      height: 7px;
      margin-top: -2.5px;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .volume-slider:hover::-webkit-slider-thumb,
    .volume-slider:focus-visible::-webkit-slider-thumb,
    .volume-slider:active::-webkit-slider-thumb {
      opacity: .9;
    }

    .volume-slider::-moz-range-track {
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .24);
    }

    .volume-slider::-moz-range-progress {
      height: 2px;
      border-radius: 999px;
      background: #fff;
    }

    .volume-slider::-moz-range-thumb {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: none;
      opacity: .9;
    }

    /* Discord picker. */
    .discord-picker {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      background: rgba(2, 3, 5, .52);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .45s ease, visibility .45s;
    }

    .discord-picker.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .discord-picker-panel {
      display: grid;
      justify-items: center;
      width: min(90vw, 420px);
      padding: 0;
      border: 0;
      background: transparent;
      transform: translateY(14px);
      transition: transform .55s cubic-bezier(.16, 1, .3, 1);
    }

    .discord-picker.is-open .discord-picker-panel {
      transform: translateY(0);
    }

    .discord-picker-title {
      margin: 0 0 22px;
      color: rgba(255, 255, 255, .55);
      font: 600 10px/1 Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: lowercase;
      text-align: center;
    }

    .discord-picker-title::after {
      content: "";
      display: block;
      width: 40px;
      height: 1px;
      margin: 16px auto 0;
      background: #a01020;
      box-shadow: 0 0 14px rgba(184, 18, 38, .7);
    }

    .discord-picker-options {
      display: grid;
      gap: 18px;
      justify-items: center;
      width: 100%;
    }

    .discord-picker-option {
      display: grid;
      gap: 8px;
      justify-items: center;
      width: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #fff;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      transition: opacity .25s ease, transform .3s cubic-bezier(.16, 1, .3, 1);
    }

    .discord-picker-label {
      color: #fff;
      font: 700 clamp(42px, 9vw, 64px)/.95 Arial, sans-serif;
      letter-spacing: -.06em;
      text-transform: lowercase;
      text-shadow: 0 5px 28px rgba(0, 0, 0, .4), 0 0 30px rgba(178, 18, 38, .14);
      transition: text-shadow .25s ease;
    }

    .discord-picker-hint {
      color: rgba(255, 255, 255, .4);
      font: italic 500 14px/1.3 Georgia, "Times New Roman", serif;
      letter-spacing: 0;
      text-transform: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .75);
      transition: color .25s ease;
    }

    .discord-picker-option:hover {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      transform: translateY(-3px) scale(1.02);
    }

    .discord-picker-option:hover .discord-picker-label {
      text-shadow: 0 5px 28px rgba(0, 0, 0, .4), 0 0 40px rgba(220, 18, 38, .28);
    }

    .discord-picker-option:hover .discord-picker-hint {
      color: rgba(255, 255, 255, .62);
    }

    .discord-picker-close {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, .55);
      font: 500 clamp(16px, 2vw, 22px)/1 monospace;
      letter-spacing: .08em;
      text-transform: lowercase;
      text-shadow: 0 3px 25px rgba(0, 0, 0, .7);
      transition: color .2s ease;
    }

    .discord-picker-close:hover {
      color: rgba(255, 255, 255, .95);
    }

    /* Entry gate. */
    .entry {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      border: 0;
      color: #fff;
      overflow: hidden;
      isolation: isolate;
      background: rgba(2, 3, 5, .52);
      cursor: pointer;
      transition: opacity .7s ease, visibility .7s;
    }

    .entry::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, rgba(91, 18, 38, .14), rgba(3, 2, 3, .28) 48%, rgba(3, 2, 3, .6));
    }

    .entry>span {
      position: relative;
      z-index: 1;
    }

    .entered .entry {
      visibility: visible;
      pointer-events: none;
      animation: entryExit .62s cubic-bezier(.4, 0, .2, 1) both;
    }

    .entry-copy {
      color: rgba(255, 255, 255, .95);
      font: 500 clamp(20px, 2.3vw, 30px)/1 monospace;
      letter-spacing: .08em;
      text-transform: lowercase;
      text-shadow: 0 3px 25px rgba(0, 0, 0, .7);
      animation: entryBreath 2.6s ease-in-out infinite;
    }

    @media (max-width: 860px) {

      .scene {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 14px 120px;
        overflow: hidden;
        overscroll-behavior: none;
      }

      .music-player {
        position: fixed;
        top: 12px;
        right: 12px;
        left: 12px;
        width: auto;
        transform: translateY(-16px);
      }

      .entered .music-player {
        transform: translateY(0);
      }

      .cd-wrap {
        position: static;
        order: 1;
        width: 56vw;
        max-width: 300px;
        margin: 74px 0 6px;
        transform: translate3d(0, 18px, 0);
      }

      .entered .cd-wrap {
        transform: translate3d(0, 0, 0);
      }

      .profile {
        position: static;
        order: 2;
        width: min(92vw, 420px);
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px 18px;
        padding: 24px 22px;
        transform: translate3d(0, 22px, 0) rotate(1.6deg);
      }

      .entered .profile {
        transform: translate3d(0, 0, 0) rotate(1.6deg);
      }

      .profile h1 {
        font-size: 38px;
      }

      .bg-video {
        filter: grayscale(1) blur(18px) brightness(.5) saturate(.82);
      }

      .eq {
        height: 72px;
        gap: 6px;
      }

      .audio-dock {
        left: 18px;
        right: 18px;
        bottom: 20px;
        justify-content: space-between;
      }

      .volume {
        gap: 8px;
      }

      .volume-slider {
        width: 108px;
      }

      .eq span {
        width: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .playing .cd-disc {
        animation: none;
      }

      .playing .eq span {
        animation: none;
      }

      .snowfall,
      .grain {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="custom-cursor" id="custom-cursor" aria-hidden="true"></div>
  <main class="scene" id="scene">
    <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="background.mp4" type="video/mp4">
    </video>
    <div class="grain" aria-hidden="true"></div>
    <div class="snowfall" id="snowfall" aria-hidden="true"></div>
    <div class="pointer-glow" aria-hidden="true"></div>

    <section class="music-player" aria-label="Music player">
      <div class="track-line">
        <span class="track-title">twig</span>
        <span class="track-subtitle">yen</span>
      </div>
      <div class="player-controls">
        <button class="player-control" id="skip-back" type="button" aria-label="Previous track"><span
            class="transport-icon back" aria-hidden="true"></span></button>
        <button class="player-control primary" id="play-toggle" type="button" aria-label="Play twig"><span
            class="play-icon" id="play-icon" aria-hidden="true"></span></button>
        <button class="player-control" id="skip-forward" type="button" aria-label="Next track"><span
            class="transport-icon forward" aria-hidden="true"></span></button>
      </div>
      <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="Song progress">
      <div class="track-status">
        <span id="current-time">0:00</span>
        <span class="remaining" id="duration">--:--</span>
      </div>
      <audio id="audio" preload="metadata" src="twig.mp3"></audio>
    </section>

    <div class="cd-wrap" aria-hidden="true">
      <div class="cd-disc">
        <img class="cd-artwork" src="twig-cover.png" alt="">
        <span class="cd-sheen"></span>
        <span class="cd-hub"></span>
      </div>
    </div>

    <section class="profile" aria-label="barebleed profile">
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <img class="avatar" src="avatar.gif" alt="barebleed profile portrait">
        </div>
      </div>

      <div class="head">
        <p class="eyebrow"><i></i> he/him</p>
        <h1>barebleed</h1>
      </div>

      <p class="bio">c++ and web developer.<br> also known as a5wv or drizzy </p>

      <nav class="socials" aria-label="Social links">
        <button class="social" id="discord-open" type="button" aria-label="Discord" aria-haspopup="dialog"
          aria-controls="discord-picker">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037 19.7363 19.7363 0 0 0-4.8852 1.515.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.198.3728.2924a.077.077 0 0 1-.0066.1276 12.2986 12.2986 0 0 1-1.873.8914.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z">
            </path>
          </svg>
        </button>
      </nav>
    </section>

    <div class="audio-dock">
      <div class="volume">
        <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Mute audio">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6.7 9H3.5v6h3.2l4.3 4z"></path>
            <path class="sound-wave" d="M15 8.2a5.2 5.2 0 0 1 0 7.6M17.8 5.6a8.8 8.8 0 0 1 0 12.8"></path>
          </svg>
        </button>
        <input class="volume-slider" id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <div class="eq" id="eq" aria-hidden="true"></div>
    </div>

    <button class="entry" id="entry" type="button">
      <span class="entry-copy">[ click to enter ]</span>
    </button>
  </main>

  <div class="discord-picker" id="discord-picker" role="dialog" aria-modal="true" aria-labelledby="discord-picker-title"
    hidden>
    <div class="discord-picker-panel">
      <p class="discord-picker-title" id="discord-picker-title">discord</p>
      <div class="discord-picker-options">
        <a class="discord-picker-option" href="https://discord.com/users/1352028232127352882" target="_blank"
          rel="noopener noreferrer nofollow">
          <span class="discord-picker-label">main</span>
          <span class="discord-picker-hint">@barebleed</span>
        </a>
        <a class="discord-picker-option" href="https://discord.com/users/1123597605113438351" target="_blank"
          rel="noopener noreferrer nofollow">
          <span class="discord-picker-label">alt</span>
          <span class="discord-picker-hint">@0271942</span>
        </a>
      </div>
    </div>
    <button class="discord-picker-close" id="discord-picker-close" type="button">[ close ]</button>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const entry = document.getElementById("entry");
    const profile = document.querySelector(".profile");
    const audio = document.getElementById("audio");
    const playToggle = document.getElementById("play-toggle");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("current-time");
    const duration = document.getElementById("duration");
    const skipBack = document.getElementById("skip-back");
    const skipForward = document.getElementById("skip-forward");
    const musicPlayer = document.querySelector(".music-player");
    const cdArtwork = document.querySelector(".cd-artwork");
    const trackTitle = document.querySelector(".track-title");
    const trackSubtitle = document.querySelector(".track-subtitle");
    const soundToggle = document.getElementById("sound-toggle");
    const volumeSlider = document.getElementById("volume");
    const bgVideo = document.querySelector(".bg-video");
    const customCursor = document.getElementById("custom-cursor");
    const discordOpen = document.getElementById("discord-open");
    const discordPicker = document.getElementById("discord-picker");
    const discordClose = document.getElementById("discord-picker-close");

    bgVideo.play().catch(() => { });

    const snowfall = document.getElementById("snowfall");
    const flakeCount = 28;

    for (let index = 0; index < flakeCount; index += 1) {
      const flake = document.createElement("span");
      const size = 1.2 + Math.random() * 1.8;
      flake.className = "snowflake";
      flake.style.left = `${Math.random() * 100}%`;
      flake.style.width = `${size}px`;
      flake.style.height = `${size}px`;
      flake.style.opacity = `${0.22 + Math.random() * 0.32}`;
      flake.style.setProperty("--drift", `${-8 + Math.random() * 16}px`);
      flake.style.animationDuration = `${14 + Math.random() * 16}s`;
      flake.style.animationDelay = `-${Math.random() * 18}s`;
      snowfall.appendChild(flake);
    }

    const eq = document.getElementById("eq");
    const barCount = 14;

    for (let index = 0; index < barCount; index += 1) {
      const bar = document.createElement("span");
      const height = 16 + Math.random() * 78;
      bar.style.height = `${Math.round(height)}px`;
      bar.style.setProperty("--dur", `${(0.5 + Math.random() * 0.9).toFixed(2)}s`);
      bar.style.setProperty("--del", `-${(Math.random() * 2).toFixed(2)}s`);
      eq.appendChild(bar);
    }

    function openDiscordPicker() {
      discordPicker.hidden = false;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => discordPicker.classList.add("is-open"));
      });
      discordClose.focus();
    }

    function closeDiscordPicker() {
      discordPicker.classList.remove("is-open");
      const finish = () => {
        if (!discordPicker.classList.contains("is-open")) discordPicker.hidden = true;
      };
      discordPicker.addEventListener("transitionend", finish, { once: true });
      setTimeout(finish, 320);
      discordOpen.focus();
    }

    discordOpen.addEventListener("click", openDiscordPicker);
    discordClose.addEventListener("click", closeDiscordPicker);
    discordPicker.addEventListener("click", event => {
      if (event.target === discordPicker) closeDiscordPicker();
    });
    discordPicker.querySelectorAll(".discord-picker-option").forEach(option => {
      option.addEventListener("click", () => closeDiscordPicker());
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && discordPicker.classList.contains("is-open")) {
        event.preventDefault();
        closeDiscordPicker();
      }
    });

    const cursorPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const cursorTarget = { x: cursorPos.x, y: cursorPos.y };
    const cursorEase = 0.14;
    const cursorScale = { current: 1, target: 1 };
    const cursorScaleEase = 0.22;

    function renderCursor() {
      cursorPos.x += (cursorTarget.x - cursorPos.x) * cursorEase;
      cursorPos.y += (cursorTarget.y - cursorPos.y) * cursorEase;
      cursorScale.current += (cursorScale.target - cursorScale.current) * cursorScaleEase;
      customCursor.style.transform = `translate(${cursorPos.x}px, ${cursorPos.y}px) scale(${cursorScale.current})`;
      requestAnimationFrame(renderCursor);
    }

    if (window.matchMedia("(pointer: fine)").matches) {
      window.addEventListener("pointermove", event => {
        cursorTarget.x = event.clientX;
        cursorTarget.y = event.clientY;
        customCursor.classList.add("is-visible");
      });
      window.addEventListener("pointerdown", () => {
        cursorScale.target = 0.82;
      });
      window.addEventListener("pointerup", () => {
        cursorScale.target = 1;
      });
      window.addEventListener("pointercancel", () => {
        cursorScale.target = 1;
      });
      document.addEventListener("mouseleave", () => {
        customCursor.classList.remove("is-visible");
        cursorScale.target = 1;
      });
      document.documentElement.addEventListener("mouseenter", () => customCursor.classList.add("is-visible"));
      renderCursor();
    } else {
      document.documentElement.style.setProperty("cursor", "auto");
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "--:--";
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainder}`;
    }

    function syncProgress() {
      const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
      progress.value = Math.round(ratio * 1000);
      progress.style.setProperty("--played", `${ratio * 100}%`);
      currentTime.textContent = formatTime(audio.currentTime);
      duration.textContent = Number.isFinite(audio.duration)
        ? `-${formatTime(Math.max(0, audio.duration - audio.currentTime))}`
        : "--:--";
    }

    const playlist = [
      { title: "twig", artist: "yen", src: "twig.mp3", cover: "twig-cover.png" },
      { title: "feel my wrath", artist: "yen", src: "feel-my-wrath.mp3", cover: "feel-my-wrath-cover.png" },
      { title: "bastard", artist: "yen", src: "bastard.mp3", cover: "bastard-cover.png" },
      { title: "i keep calling ...", artist: "wifiskeleton, jaydes", src: "i-keep-calling.mp3", cover: "i-keep-calling-cover.png" },
      { title: "i'm a piece of shit", artist: "yen", src: "im-a-piece-of-shit.mp3", cover: "im-a-piece-of-shit-cover.png" },
    ];

    let trackIndex = 0;
    let isSwitching = false;
    const switchMs = 240;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function updateTrackLabels() {
      const track = playlist[trackIndex];
      musicPlayer.setAttribute("aria-label", `Music player for ${track.title}`);
      playToggle.setAttribute("aria-label", audio.paused ? `Play ${track.title}` : `Pause ${track.title}`);
    }

    function applyTrack(index) {
      trackIndex = (index + playlist.length) % playlist.length;
      const track = playlist[trackIndex];
      audio.src = track.src;
      cdArtwork.src = track.cover;
      trackTitle.textContent = track.title;
      trackSubtitle.textContent = track.artist;
      progress.value = 0;
      progress.style.setProperty("--played", "0%");
      currentTime.textContent = "0:00";
      duration.textContent = "--:--";
      audio.load();
      updateTrackLabels();
    }

    async function loadTrack(index, autoplay = false) {
      const nextIndex = (index + playlist.length) % playlist.length;
      if (isSwitching || nextIndex === trackIndex) return;

      isSwitching = true;
      const wasPlaying = autoplay || !audio.paused;
      musicPlayer.classList.add("is-switching");
      scene.classList.add("is-switching");

      await wait(switchMs / 2);
      if (wasPlaying) audio.pause();
      applyTrack(nextIndex);
      await wait(switchMs / 2);
      musicPlayer.classList.remove("is-switching");
      scene.classList.remove("is-switching");

      if (wasPlaying) audio.play().catch(() => { });
      isSwitching = false;
    }

    function changeTrack(delta) {
      loadTrack(trackIndex + delta, !audio.paused);
    }

    function enterProfile() {
      scene.classList.add("entered");
      entry.setAttribute("aria-hidden", "true");
      entry.tabIndex = -1;
      audio.play().catch(() => { });
    }

    entry.addEventListener("click", enterProfile);
    window.addEventListener("keydown", event => {
      if (!scene.classList.contains("entered") && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        enterProfile();
      }
    });

    scene.addEventListener("pointermove", event => {
      document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
      document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
    });

    profile.addEventListener("pointermove", event => {
      const bounds = profile.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width;
      const y = (event.clientY - bounds.top) / bounds.height;
      profile.style.setProperty("--tilt-x", `${(0.5 - y) * 5}deg`);
      profile.style.setProperty("--tilt-y", `${(x - 0.5) * 7}deg`);
      profile.style.setProperty("--move-x", `${(x - 0.5) * 10}px`);
      profile.style.setProperty("--move-y", `${(y - 0.5) * 8}px`);
      profile.style.setProperty("--shine-x", `${x * 100}%`);
      profile.style.setProperty("--shine-y", `${y * 100}%`);
    });

    profile.addEventListener("pointerleave", () => {
      profile.style.setProperty("--tilt-x", "0deg");
      profile.style.setProperty("--tilt-y", "0deg");
      profile.style.setProperty("--move-x", "0px");
      profile.style.setProperty("--move-y", "0px");
      profile.style.setProperty("--shine-x", "50%");
      profile.style.setProperty("--shine-y", "35%");
    });

    playToggle.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => { });
      } else {
        audio.pause();
      }
    });

    skipBack.addEventListener("click", () => changeTrack(-1));

    skipForward.addEventListener("click", () => changeTrack(1));

    soundToggle.addEventListener("click", () => {
      audio.muted = !audio.muted;
      soundToggle.classList.toggle("is-muted", audio.muted);
      soundToggle.setAttribute("aria-label", audio.muted ? "Unmute audio" : "Mute audio");
    });

    volumeSlider.addEventListener("input", () => {
      const level = Number(volumeSlider.value) / 100;
      audio.volume = level;
      volumeSlider.style.setProperty("--filled", `${volumeSlider.value}%`);
      if (audio.muted && level > 0) {
        audio.muted = false;
        soundToggle.classList.remove("is-muted");
        soundToggle.setAttribute("aria-label", "Mute audio");
      }
    });

    volumeSlider.style.setProperty("--filled", `${volumeSlider.value}%`);
    audio.volume = Number(volumeSlider.value) / 100;

    progress.addEventListener("input", () => {
      if (!audio.duration) return;
      audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
      syncProgress();
    });

    audio.addEventListener("loadedmetadata", () => {
      syncProgress();
    });

    audio.addEventListener("timeupdate", syncProgress);
    audio.addEventListener("ended", () => loadTrack(trackIndex + 1, true));
    audio.addEventListener("play", () => {
      playToggle.classList.add("is-playing");
      scene.classList.add("playing");
      updateTrackLabels();
    });
    audio.addEventListener("pause", () => {
      playToggle.classList.remove("is-playing");
      scene.classList.remove("playing");
      updateTrackLabels();
    });

  </script>
</body>

</html>
